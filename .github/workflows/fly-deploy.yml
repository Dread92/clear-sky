# Optional: deploy to Fly.io on every push to main.
# Enable it by adding the repository secret FLY_API_TOKEN (fly tokens create deploy).
# Without that secret the job is skipped, so the workflow is harmless until you want it.
name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: fly deploy
    runs-on: ubuntu-latest
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only --ha=false
