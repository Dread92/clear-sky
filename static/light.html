<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Clear Sky Light</title>
<link rel="manifest" href="/light.webmanifest">
<link rel="icon" href="/static/logo-64.png">
<link rel="apple-touch-icon" href="/static/logo-192.png">
<style>
/* Clear Sky Light — one place, what concerns it, nothing else.
   No map tiles and no feed: it has to load and be read on 2G, at night, in a corridor. The small map under the
   radar is drawn from one 37 KB outline file (gzipped), fetched after the status is already on screen. */
:root{--bg:#0b0d11;--panel:#12151b;--panel2:#181c24;--line:#242830;--ink:#e8e6df;--ink2:#a9a79f;--ink3:#6c6b66;
  --red:#e0342c;--yel:#f2c200;--grn:#2fbf71;--ora:#ff8a3d;--amb:#ffb15c;--msl:#ff5b52;--vio:#b07cff;--cri:#ff2d55;--blu:#5b9cff;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:10px 14px}
header b{font:800 17px/1 var(--sans);letter-spacing:.06em}
/* Light | Tactical: the two versions, as one big switch across the top — the first thing the eye meets,
   each half saying what it is. Not a link hidden in a menu or a footer. */
.sw{display:flex;margin:0 14px 12px;border:2px solid var(--ora);border-radius:8px;overflow:hidden;box-shadow:0 0 0 3px rgba(255,138,61,.12)}
.sw>*{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 9px;text-decoration:none;color:#fff;background:#1a202b}
.sw b{font:800 15px/1 var(--sans);letter-spacing:.1em}
.sw small{font:500 11px/1.2 var(--sans);opacity:.8;text-align:center}
.sw .on{background:var(--ora);color:#14100a}
.sw a b::after{content:' ›'}
.sw a:hover,.sw a:focus{background:#242c3a}
header .up{margin-left:auto;font:11px var(--mono);color:var(--ink3)}
.slots{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.slots button{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:8px 11px;border:1px solid var(--line);background:var(--panel);border-radius:3px;font:600 13px var(--sans);color:var(--ink2)}
.slots button.on{border-color:var(--ora);color:var(--ink);background:#281e12}
.slots button.empty{opacity:.5}
#imm{margin:0 14px 10px;padding:12px 14px;background:#4a0d12;border:1px solid #8a2a2a;border-left:5px solid var(--red);border-radius:3px}
#imm b{display:block;font:800 16px/1.25 var(--sans);text-transform:uppercase;letter-spacing:.02em}
#imm small{display:block;color:#ffd6d6;margin-top:4px;font-size:12.5px}
.status{margin:0 14px;padding:16px 16px 14px;border-radius:4px;border:1px solid var(--line);background:var(--panel)}
.status .big{font:800 22px/1.15 var(--sans);letter-spacing:.02em}
.status .pl{font-size:14px;color:var(--ink2);margin-top:4px}
.status .src{font:11px var(--mono);color:var(--ink3);margin-top:8px}
.status.R{background:#3a0b10;border-color:#8a2a2a}.status.R .big{color:#ffd6d6}
.status.Y{background:#332905;border-color:#7a6212}.status.Y .big{color:#ffe9a8}
.status.G{background:#0e2018;border-color:#25503c}.status.G .big{color:#b8e6cc}
.status.U .big{color:var(--ink2)}
.status.H,.status.P{background:#231c0a;border-color:#6a5a1a}.status.H .big,.status.P .big{color:#ffe9a8}
.status .lv{font-size:13px;margin-top:6px;color:var(--ink)}
.status .nb{font-size:12.5px;margin-top:6px;color:var(--ink2)}
.status .nb b{color:#ffe9a8;font-weight:600}.status .nb b.R{color:#ffb4ae}
.status .oo{font-size:12.5px;margin-top:6px;color:#ffe9a8}
#radar{display:block;width:100%;max-width:440px;margin:12px auto 0}
#radar .bg{fill:#10141b}
#radar .obl{fill:none;stroke:#4a5566;stroke-width:1.1px;vector-effect:non-scaling-stroke;stroke-dasharray:5 3}
#radar .rb{fill:none;stroke:#2a313d;stroke-width:.8px;vector-effect:non-scaling-stroke}
#radar .rb.city{stroke:#56637a;stroke-width:1.2px;fill:rgba(120,140,170,.06)}
#radar .rb.R,#radar .ob2.R{fill:rgba(224,52,44,.2);stroke:rgba(224,52,44,.55)}
#radar .rb.Y,#radar .ob2.Y{fill:rgba(242,194,0,.14);stroke:rgba(242,194,0,.45)}
#radar .rb.H{fill:rgba(242,194,0,.06);stroke:rgba(242,194,0,.35);stroke-dasharray:3 2}
#radar .ob2{fill:none;stroke:none}
#radar .riv{fill:none;stroke:#2b5f8f;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#radar .riv.wide{stroke-width:4px}#radar .riv.mid{stroke-width:2.6px}#radar .riv.thin{stroke-width:1.2px;stroke:#244f78}
#radar .rd{fill:none;stroke:#3a3430;stroke-width:1px;vector-effect:non-scaling-stroke}
#radar .tw{fill:#8b93a3}
#radar .tl{fill:#aab1bd;font:600 3.5px var(--sans);paint-order:stroke;stroke:#0b0d11;stroke-width:.9px}
#radar .tl.big{fill:#d6dae2;font-size:4.3px}
#radar .tail{fill:none;stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-dasharray:2 3;stroke-opacity:.8}
#radar .cnt{font:700 3.6px var(--mono);paint-order:stroke;stroke:#0b0d11;stroke-width:.9px}
.lg{max-width:440px;margin:2px auto 6px;padding:0 14px;font-size:11px;color:var(--ink3);text-align:center}
#radar .kd{fill:none;stroke:#334055;stroke-width:.7px;vector-effect:non-scaling-stroke}
#radar .kdl{fill:#6f7c92;font:600 2.7px var(--sans);text-anchor:middle;letter-spacing:.02em;text-transform:uppercase}
#radar .vl{fill:#838b99;font:500 2.9px var(--sans);paint-order:stroke;stroke:#0b0d11;stroke-width:.8px}
#radar .vd{fill:#5d6573}
#radar .rvl{fill:#4f86bd;font:italic 600 3.1px var(--sans);paint-order:stroke;stroke:#0b0d11;stroke-width:.8px}
#radar .no{font:800 3.4px var(--mono);fill:#fff;paint-order:stroke;stroke:#0b0d11;stroke-width:1px}
.row{cursor:pointer}
.row .no{display:inline-block;min-width:16px;padding:0 3px;margin-right:6px;border-radius:3px;background:#2a303b;color:#fff;font:800 11px/16px var(--mono);text-align:center;vertical-align:2px}
.row .l2 .wh{color:var(--ink)}
.row .l2 b.alt{color:#cfe0ff;font-weight:700}.row .l2 b.dsc{color:#ff4d6d;font-weight:800}
#radar .altl{font:700 3.1px var(--mono);fill:#cfe0ff;paint-order:stroke;stroke:#0b0d11;stroke-width:.8px}
#radar .altl.dsc{fill:#ff4d6d}
.row .more{display:none;margin-top:8px;padding:8px 10px;background:var(--panel);border-left:3px solid var(--line);border-radius:2px;font-size:12.5px;color:var(--ink2)}
.row.open .more{display:block}
.row .more q{display:block;color:var(--ink);quotes:none;white-space:pre-line;margin-bottom:6px}
.row .more .orig{display:block;color:var(--ink3);font-size:11.5px;margin:-2px 0 6px;white-space:pre-line}
.row .more div+div{margin-top:4px}
.row .tap{font-size:11px;color:var(--ink3);margin-top:3px}
.sec{margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line);font:700 11.5px var(--mono);letter-spacing:.06em;color:#ffb3a6;text-transform:uppercase}
#radar .ring{fill:none;stroke:#2f5480;stroke-width:.5;stroke-dasharray:1.6 2}
#radar .ring.r10{stroke:var(--ora);stroke-dasharray:none;stroke-opacity:.7}
#radar .rl{fill:#56637a;font:3.4px var(--mono)}
#radar .nn{fill:var(--ink3);font:700 4.2px var(--mono)}
#radar .me{fill:var(--ink)}
#radar .t{stroke:#0b0d11;stroke-width:.5}
#radar .t.gone{opacity:.35}
/* the same silhouettes as the Tactical map (static/glyphs.js), filled with the weapon's colour */
.sil .glyph{fill:var(--c);stroke:#0b0d11;stroke-width:1px;vector-effect:non-scaling-stroke}
.sil .glyph.tri{fill:var(--c)}
.sil .jetfx{display:none}.sil.jet .jetfx{display:inline}.sil .flame{fill:#ffb347;stroke:none}.sil .flame2{fill:#fff4d6;stroke:none}
.sil.bal .glyph{fill:#fff;stroke:#ff1744;stroke-width:1.4px}
.sil.sup .glyph{fill:#ffdca8;stroke:#ff6a00;stroke-width:1.3px}
#radar .qm{font:800 3.6px var(--sans);fill:#cfd6e2;paint-order:stroke;stroke:#0b0d11;stroke-width:.8px;text-anchor:middle}
#list{padding:4px 14px 8px}
.row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row .ic{flex:0 0 30px;height:30px;border-radius:6px;background:#1a202b;display:flex;align-items:center;justify-content:center}
.row .ic svg{width:26px;height:26px;overflow:visible}
.row.here .ic{background:#3a0f1a;box-shadow:inset 0 0 0 1.5px var(--cri)}
.row .bd{flex:1;min-width:0}
.row .l1{display:flex;gap:8px;align-items:baseline}
.row .l1 b{font:700 15px var(--sans)}
.row .l1 .d{margin-left:auto;font:700 15px var(--mono)}
.row .l2{font-size:12.5px;color:var(--ink2);margin-top:2px}
.row .l3{font-size:12.5px;margin-top:3px}
.row .l3 b{color:var(--ink)}.row .l3 span{color:var(--ink3)}
.row.here .l1 b,.row.here .hr{color:#ff8fa3}
.row.gone{opacity:.5}
.none{padding:18px 4px;text-align:center}
.none b{display:block;font-size:15px}.none small{display:block;color:var(--ink3);margin-top:4px;font-size:12.5px}
#off{margin:8px 14px 0;padding:8px 10px;border:1px solid #6a5a1a;background:#221d0b;color:#ffe9a8;font-size:12.5px;border-radius:3px}
footer{padding:14px 14px 24px;font-size:12px;color:var(--ink3);text-align:center}
footer a{color:var(--blu)}
/* the notice at opening — once per opening, shared with the Tactical page (sessionStorage 'disc_seen') */
#dm{position:fixed;inset:0;z-index:10;background:rgba(5,6,9,.9);display:flex;align-items:center;justify-content:center;padding:16px}
#dm[hidden]{display:none}
#dm .dbox{max-width:440px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--yel);border-radius:4px;padding:16px 18px;max-height:90vh;overflow:auto}
#dm b{display:block;font:800 17px/1.2 var(--sans);margin-bottom:8px}
#dm p{font-size:14px;line-height:1.45;color:var(--ink2);margin:0 0 10px}#dm p b,#dm p strong{display:inline;font-size:inherit;color:var(--ink)}
#dm button{display:block;margin:12px 0 0 auto;padding:10px 16px;border:1px solid var(--yel);border-radius:3px;color:var(--yel);font-weight:700}
#pick{position:fixed;inset:0;background:rgba(5,6,9,.94);display:none;flex-direction:column;padding:16px 14px;z-index:9}
#pick.show{display:flex}
#pick h3{font:700 17px var(--sans)}#pick p{color:var(--ink2);font-size:13px;margin:6px 0 12px}
#pick input{width:100%;padding:12px;font-size:16px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
#pick .loc{margin:10px 0;padding:12px;border:1px solid var(--ora);border-radius:3px;font-weight:600;text-align:left}
#pick .res{flex:1;overflow-y:auto;margin-top:6px}
#pick .res button{display:block;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
#pick .res button small{color:var(--ink3);margin-left:6px}
#pick .x{align-self:flex-end;padding:10px 4px;color:var(--ink2)}
</style>
</head>
<body>
<header><b>CLEAR SKY</b><span class="up" id="up"></span></header>
<nav class="sw" id="sw"><span class="on"><b id="swl">LIGHT</b><small id="swl2"></small></span><a href="/m"><b id="swt">TACTICAL</b><small id="swt2"></small></a></nav>
<div class="slots" id="slots"></div>
<div id="imm" hidden></div>
<div class="status U" id="status"><div class="big">…</div></div>
<svg id="radar" viewBox="-66 -66 132 132" aria-hidden="true"></svg>
<div class="lg" id="lg" hidden></div>
<div id="list"></div>
<div id="off" hidden></div>
<footer><div id="disc"></div><div style="margin-top:8px"><a href="/m" id="full"></a></div></footer>
<div id="dm" hidden><div class="dbox"><b id="dmt"></b><p id="dm1"></p><p id="dm2"></p><p id="dm3"></p><button id="dmok"></button></div></div>
<div id="pick"><button class="x" id="pickx">✕</button><h3 id="pickh"></h3><p id="pickp"></p>
  <input id="pickq" autocomplete="off"><button class="loc" id="pickloc"></button><div class="res" id="pickres"></div></div>
<script src="/static/i18n.js"></script>
<script src="/static/glyphs.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NS='http://www.w3.org/2000/svg';
document.documentElement.lang=LANG;
const fmtT=ts=>{try{return new Date(ts).toLocaleTimeString('uk-UA',{timeZone:'Europe/Kyiv',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}};
const agoMin=ts=>Math.max(0,Math.round((Date.now()-Date.parse(ts))/60000));

// ---- the four places: the same browser storage as the full app, never sent anywhere ----------------------
const SLOT_IDS=['home','work','kids','pin'], SLOT_ICO={home:'🏠',work:'💼',kids:'🏫',pin:'📍'};
let SLOTS={home:null,work:null,kids:null,pin:null}, ACTIVE='home';
try{const r=JSON.parse(localStorage.getItem('slots')||'null'); if(r&&typeof r==='object') for(const k of SLOT_IDS) if(r[k]) SLOTS[k]=r[k];
    const a=localStorage.getItem('slot_active'); if(SLOT_IDS.includes(a)) ACTIVE=a;
    const old=JSON.parse(localStorage.getItem('home')||'null'); if(old&&!SLOTS.home) SLOTS.home=old;}catch(e){}
function save(){try{localStorage.setItem('slots',JSON.stringify(SLOTS));localStorage.setItem('slot_active',ACTIVE);}catch(e){}}
const place=()=>SLOTS[ACTIVE]||null;
const placeName=p=>!p?'':p.dropped?t('sl_pin_dropped'):(LANG==='uk'&&p.uk?p.uk:(p.name||p.uk||''));

// ---- geometry ----------------------------------------------------------------------------------------------
const DIRS=t('dirs').split(',');
const _TRL={а:'a',б:'b',в:'v',г:'h',ґ:'g',д:'d',е:'e',є:'ie',ж:'zh',з:'z',и:'y',і:'i',ї:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ь:'',ю:'iu',я:'ia',"'":'',"ʼ":'',"’":''};
function translit(s){ let o=''; for(let i=0;i<s.length;i++){ const c=s[i], l=c.toLowerCase(); let t0;
  const first=i===0||/[\s-]/.test(s[i-1]);
  if(first&&l in {'є':1,'ї':1,'й':1,'ю':1,'я':1}) t0={'є':'ye','ї':'yi','й':'y','ю':'yu','я':'ya'}[l]; else t0=_TRL[l]??c;
  if(c!==l&&t0) t0=t0[0].toUpperCase()+t0.slice(1); o+=t0; } return o; }
const rad=d=>d*Math.PI/180;
function km(la1,lo1,la2,lo2){const a=Math.sin(rad(la2-la1)/2)**2+Math.cos(rad(la1))*Math.cos(rad(la2))*Math.sin(rad(lo2-lo1)/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(a)));}
function brg(la1,lo1,la2,lo2){const y=Math.sin(rad(lo2-lo1))*Math.cos(rad(la2)),x=Math.cos(rad(la1))*Math.sin(rad(la2))-Math.sin(rad(la1))*Math.cos(rad(la2))*Math.cos(rad(lo2-lo1));return (Math.atan2(y,x)*180/Math.PI+360)%360;}
const angDiff=(a,b)=>Math.abs(((a-b)+540)%360-180);

// ---- which oblast the place is in, worked out here -----------------------------------------------------
// Asking the server would send the coordinates of the place — one of which is a school — which is the one
// thing these four places are promised never to do. So the outline file is fetched once and tested on the
// phone, and the answer is cached inside the place itself.
let UAMAP=null;
async function oblastOf(p){
  if(p.obl) return p.obl;
  try{ if(!UAMAP) UAMAP=await (await fetch('/static/ukraine-map.json')).json(); }catch(e){ return null; }
  const [a,b,c]=UAMAP.proj.x,[d,e,f]=UAMAP.proj.y, x=a*p.lon+b*p.lat+c, y=d*p.lon+e*p.lat+f;
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox',UAMAP.viewBox);
  svg.style.cssText='position:absolute;width:1px;height:1px;left:-9px;overflow:hidden'; document.body.appendChild(svg);
  const order=[...UAMAP.oblasts].sort((u,v)=>(u.uid==='31'?-1:0)-(v.uid==='31'?-1:0));   // the city before the oblast around it
  let found=null;
  for(const o of order){ const el=document.createElementNS(NS,'path'); el.setAttribute('d',o.path); svg.appendChild(el);
    try{ if(el.isPointInFill(new DOMPoint(x,y))){found=o.uid;break;} }catch(e){} }
  svg.remove();
  if(found){ p.obl=found; save(); }
  return found;
}

// ---- which RAION the place is in, also worked out here ------------------------------------------------
// The government app alerts by raion. Boryspil raion can be clear while Brovary, next door, is under alert —
// so the answer for a place is its raion's, and to know the raion the outlines of the raions around Kyiv are
// fetched once (light-map.json) and tested here. Nothing about the place leaves the phone.
let LM=null, LMR=null, LMO=null;
const unflat=f=>{const o=[];for(let i=0;i<f.length;i+=2)o.push([f[i],f[i+1]]);return o;};
let KD=null, VIL=null;   // Kyiv districts; villages and neighbourhoods (names on the map only — nothing is sent)
async function loadExtras(){
  try{ if(!KD) KD=(await (await fetch('/static/kyiv-districts.json')).json()).districts; }catch(e){}
  try{ if(!VIL){ const pl=PLACES||(await (await fetch('/api/places?oblast=31,14,10,25,19,24,4,20')).json()).places;
    // settlements and neighbourhoods only: no plants, parks, roads, or "Brovary south"-style aliases of a town already on the map
    VIL=pl.filter(x=>!/громада|берег|столиця|водосховище|море|АЕС|ГЕС|ТЕЦ|траса|шосе|проспект|вулиц|міст\b|аеропорт|район$|очисн|парк|станці|завод|\s(південь|північ|схід|захід|центр)$/i.test(x.name)); } }catch(e){}
}
async function loadLM(){
  if(LM) return LM;
  try{ LM=await (await fetch('/static/light-map.json')).json();
    LMR=LM.raions.map(r=>({...r,rings:r.p.map(unflat),city:r.obl==='31'}));
    LMO=LM.oblasts.map(o=>({uid:o.uid,rings:o.p.map(unflat)})); }
  catch(e){ LM=null; }
  return LM;
}
const kproj=(lon,lat)=>[(lon-LM.center[0])*LM.kx,-(lat-LM.center[1])*LM.ky];   // the outlines' own km grid
function inRings(x,y,rings){ let c=false;
  for(const g of rings) for(let i=0,j=g.length-1;i<g.length;j=i++){ const [xi,yi]=g[i],[xj,yj]=g[j];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; }
  return c; }
function edgeKm(x,y,rings){ let best=1e9;
  for(const g of rings) for(let i=0,j=g.length-1;i<g.length;j=i++){ const [ax,ay]=g[j],[bx,by]=g[i], dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy||1e-9;
    const u=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)); best=Math.min(best,Math.hypot(ax+u*dx-x,ay+u*dy-y)); }
  return best; }
// The outlines are right to a few hundred metres. A house within 1.5 km of a border belongs to both sides:
// it gets the alert of either raion, never neither.
const BORDER_KM=1.5;
function raionsOf(p){
  if(!LMR) return null;
  const [x,y]=kproj(p.lon,p.lat), out=[], seen=new Set();
  for(const r of LMR){ const id=r.obl+':'+r.k; if(seen.has(id)) continue;
    if(inRings(x,y,r.rings)||edgeKm(x,y,r.rings)<=BORDER_KM){ seen.add(id); out.push({...r,inside:inRings(x,y,r.rings)}); } }
  return out.sort((a,b)=>b.inside-a.inside);
}
const unitName=r=>r.city?t('b_kyiv'):LANG==='uk'?(r.uk||r.en):t('lt_unit_r',RAION_N[r.k]?raionName(r.k):r.en);

// ---- the rules, the same as the full app's ------------------------------------------------------------
// Weapons that outrun any radius: they concern the whole region, with no distance and no countdown.
const IMMEDIATE=new Set(['ballistic_missiles','mig31k_departure','supersonic_missiles']); const REGION_R=150;
const SPEED_BAND={drone:[2.2,3.2],jet:[5.5,8.0],cruise:[11,14]};
const band=m=>m.type==='drones'?(m.jet?SPEED_BAND.jet:SPEED_BAND.drone):(m.type==='cruise_missiles'||m.type==='unspecified_missiles'||m.type==='banderol_missiles')?SPEED_BAND.cruise:null;
const statedCourse=m=>m.heading!=null&&!!(m.evidence&&m.evidence.heading&&m.evidence.heading.confidence&&m.evidence.heading.confidence!=='none');
// The radius the page watches: 30 km. Inside 10 km is "near"; 10–30 "approaching". Beyond 30 km only what a
// post says is heading here is listed, apart, under "approaching" — up to 100 km out.
const R_KM=30, FAR_KM=100, S=2;   // S: SVG units per kilometre on the radar (the disc is 60 units = 30 km)
const ZONES=[[10,'near'],[30,'approach']];
const zoneOf=d=>{for(const [r,k] of ZONES) if(d<=r) return k; return null;};
const CLOSING=new Set(['down','impact','lost','clear']);
const COL={drones:'--ora',jet:'--amb',cruise_missiles:'--msl',unspecified_missiles:'--msl',banderol_missiles:'--amb',ballistic_missiles:'--msl',
  supersonic_missiles:'--msl',guided_aerial_bombs:'--vio',tactic_aircraft_activity:'--vio',strategic_aircraft_activity:'--ink2',mig31k_departure:'--vio',unknown:'--ink2'};
const colOf=m=>getComputedStyle(document.documentElement).getPropertyValue(m.type==='drones'&&m.jet?COL.jet:(COL[m.type]||'--ink2')).trim();
const label=m=>m.type==='drones'?(m.jet?t('k_jet'):t('k_shahed')):({ballistic_missiles:t('th_bal'),cruise_missiles:t('th_cruise'),unspecified_missiles:t('th_msl'),
  banderol_missiles:t('th_band'),supersonic_missiles:t('th_super'),guided_aerial_bombs:t('th_kab'),tactic_aircraft_activity:t('th_tac'),
  strategic_aircraft_activity:t('th_strat'),mig31k_departure:t('th_mig')}[m.type]||t('th_unknown2'));
// The weapon's own silhouette — the same drawing as on the Tactical map (static/glyphs.js).
const silKey=m=>(m.type==='drones'&&m.jet)?'jetdrone':(GLYPH_BY_TYPE[m.type]||'missile');
const silCls=m=>'sil'+((m.type==='drones'&&m.jet)?' jet':'')+(m.type==='ballistic_missiles'?' bal':'')+(m.type==='supersonic_missiles'?' sup':'');
// It turns only to a course the post reported. No course, or nobody said what it is: upright.
const markOrient=m=>(m.type!=='unknown'&&statedCourse(m))?m.heading:0;
const icoSvg=(m,c)=>`<svg viewBox="-13 -13 26 26" aria-hidden="true"><g class="${silCls(m)}" style="--c:${c}">${G[silKey(m)]||''}</g></svg>`;

// An outcome reported after a track closes it — same family, within 40 min, within 60 km, roughly ahead of
// it. Otherwise a Shahed already shot down stays on this list as if it were still flying.
function link(ms){
  const tr=ms.filter(m=>!m.status), st=ms.filter(m=>m.status&&CLOSING.has(m.status)&&m.lat!=null&&m.lon!=null);   // an oblast-wide outcome has no point to link from
  for(const s of st){ let best=null;
    for(const m of tr){ if(m.endedBy) continue; const dt=(Date.parse(s.ts)-Date.parse(m.ts))/60000; if(dt<-2||dt>40) continue;
      if((m.type==='drones')!==(s.type==='drones')) continue;
      const d=km(m.lat,m.lon,s.lat,s.lon); if(d>60) continue;
      if(m.heading!=null&&d>8&&angDiff(m.heading,brg(m.lat,m.lon,s.lat,s.lon))>55) continue;
      if(s.status==='clear'&&d>25) continue;
      const sc=d+dt*.5; if(!best||sc<best.sc) best={m,sc}; }
    if(best) best.m.endedBy=s; }
  return tr.filter(m=>!m.endedBy);
}

// ---- state -------------------------------------------------------------------------------------------------
let STATE=null, MKS=[], LAST_OK=0, OBL=null, OBL_GUESS=false; const SEEN=new Set();

// Does this official alert cover this raion shape?
const covers=(a,r)=>a.oblast_uid===r.obl&&(a.location_type==='oblast'||(r.city&&a.location_type==='city')
  ||(a.location_type==='raion'&&((r.id&&a.location_uid==='ua-'+r.id)||(a.raion_key&&a.raion_key===r.k))));
const inPart=(a,r)=>a.location_type==='hromada'&&a.oblast_uid===r.obl&&((r.id&&a.raion_uid===r.id)||(a.raion_key&&a.raion_key===r.k));

// What the government app says about THIS place: its raion (or the city), not its oblast.
//   R / Y  — an air-raid alert over the place's own unit, at the official red or yellow level
//   H      — an alert over a hromada inside the place's raion (which hromada is the place's, the app can't know)
//   G      — no alert over the place's unit; alerts next door are listed, not painted on it
//   U      — no data
function placeStatus(uid, PR){
  if(!STATE) return {k:'U'};
  const air=(STATE.active||[]).filter(a=>!a.alert_type||a.alert_type==='air_raid');
  let mine=[], part=[];
  if(PR&&PR.length){ for(const a of air){ if(PR.some(r=>covers(a,r))) mine.push(a); else if(PR.some(r=>inPart(a,r))) part.push(a); } }
  else { mine=air.filter(a=>a.oblast_uid===uid&&(a.location_type==='oblast'||a.location_type==='city'));
         part=air.filter(a=>a.oblast_uid===uid&&!mine.includes(a)); }
  const pair=uid==='31'||uid==='14'?['31','14']:[uid];
  const others=air.filter(a=>pair.includes(a.oblast_uid)&&!mine.includes(a)&&!part.includes(a));
  const since=xs=>xs.filter(a=>a.since_known!==false).map(a=>a.started_at).sort()[0];
  const mirror=mine.some(a=>a.source==='ubilling_mirror');
  if(mine.length){ const red=mine.some(a=>a.alert_level!=='yellow');   // no level reported (mirror) = full red
    return {k:red?'R':'Y',lvl:red?(mine.some(a=>a.alert_level==='red')?'red':null):'yellow',since:since(mine),
            reason:(mine.find(a=>a.alert_level===(red?'red':'yellow')&&a.notes&&/рівень/.test(a.notes))||{}).notes,mirror,others}; }
  if(part.length) return {k:PR&&PR.length?'H':'P',since:since(part),part,others};   // P: raion unknown, part of the oblast
  return {k:'G',others};
}

// ---- the small map ------------------------------------------------------------------------------------------
// Raion and oblast outlines, the Dnipro and the other rivers, the main roads, the towns — the same the full map
// draws, from local data. Raions under an official alert are shaded red or yellow, as in the government app.
function alertedShapes(){
  const out={}; if(!STATE||!LMR) return out;
  const air=(STATE.active||[]).filter(a=>!a.alert_type||a.alert_type==='air_raid');
  for(const r of LMR){ let L='';
    for(const a of air){ if(covers(a,r)) L=(L==='R'||a.alert_level!=='yellow')?'R':'Y'; else if(!L&&inPart(a,r)) L='H'; }
    if(L) out[r.obl+':'+r.k]=L; }
  return out;
}
function mapLayer(p,kx,loc){
  if(!LM) return '';
  // outline km (the full map's grid, centred on Kyiv) → radar units around the place, the frame the markers are in
  const sx=kx/LM.kx, tx=(LM.center[0]-p.lon)*kx, ty=(p.lat-LM.center[1])*LM.ky;
  const T=`transform="translate(${(tx*S).toFixed(2)} ${(ty*S).toFixed(2)}) scale(${(sx*S).toFixed(4)} ${S})"`;
  const d=rings=>rings.map(g=>'M'+g.map(q=>q[0]+' '+q[1]).join('L')+'Z').join('');
  const [px,py]=kproj(p.lon,p.lat), near=r=>r.rings.some(g=>g.some(q=>Math.abs(q[0]-px)<50&&Math.abs(q[1]-py)<45));
  const al=alertedShapes(), air=STATE?(STATE.active||[]).filter(a=>!a.alert_type||a.alert_type==='air_raid'):[];
  const scoped=new Set(LMR.map(r=>r.obl));
  let s=`<g ${T}>`;
  // oblasts beyond the raion outlines: shaded only for an oblast-wide alert
  for(const o of LMO){ if(scoped.has(o.uid)||!near(o)) continue;
    const w=air.find(a=>a.oblast_uid===o.uid&&a.location_type==='oblast'); if(w) s+=`<path class="ob2 ${w.alert_level==='yellow'?'Y':'R'}" d="${d(o.rings)}"/>`; }
  for(const r of LMR){ if(!near(r)) continue; const L=al[r.obl+':'+r.k]||'';
    s+=`<path class="rb${r.city?' city':''}${L?' '+L:''}" d="${d(r.rings)}"/>`; }
  // Kyiv's ten districts, when the city is on the disc
  const kdOn=KD&&Math.hypot(px,py)<45;
  if(kdOn) for(const k of KD) s+=`<path class="kd" d="${k.path}"/>`;
  for(const o of LMO) if(near(o)) s+=`<path class="obl" d="${d(o.rings)}"/>`;
  s+='</g>';
  const line=pts=>pts.map(q=>loc(q[0],q[1]).map(v=>v.toFixed(1)).join(',')).join(' ');
  for(const r of LM.roads) s+=`<polyline class="rd" points="${line(r)}"/>`;
  if(LM.ring) s+=`<polyline class="rd" points="${line(LM.ring)}"/>`;
  for(const [w,pts] of LM.rivers) s+=`<polyline class="riv ${w}" points="${line(pts)}"/>`;
  // names: a name is left out rather than printed over another, or cut by the edge of the disc
  const boxes=[];
  const fits=(bx)=>!boxes.some(b=>bx[0]<b[0]+b[2]&&b[0]<bx[0]+bx[2]&&bx[1]<b[1]+b[3]&&b[1]<bx[1]+bx[3])
    &&Math.hypot(bx[0]+bx[2],bx[1]+bx[3])<59&&Math.hypot(bx[0],bx[1])<59&&Math.hypot(bx[0]+bx[2],bx[1])<59&&Math.hypot(bx[0],bx[1]+bx[3])<59;
  boxes.push([-5,-5,10,10]);   // the place's own dot
  // district names first inside the city (they are the words people use there), then towns, rivers, villages
  if(kdOn) for(const k of KD){ const pts=(k.path.match(/-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?/g)||[]).map(q=>q.split(',').map(Number));
    if(!pts.length) continue; const cx=pts.reduce((a,q)=>a+q[0],0)/pts.length, cy=pts.reduce((a,q)=>a+q[1],0)/pts.length;
    const [x,y]=[(cx*sx+tx)*S,(cy+ty)*S], nm=LANG==='uk'?k.uk.replace(/\s*район$/,''):k.name, w=nm.length*1.75+1;
    const bx=[x-w/2,y-2.6,w,3.4]; if(!fits(bx)) continue; boxes.push(bx);
    s+=`<text class="kdl" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${esc(nm)}</text>`; }
  const tw=LM.towns.map(tn=>({n:townName(tn[0]),xy:loc(tn[1],tn[2]),big:tn[3]===1})).filter(o=>Math.hypot(o.xy[0],o.xy[1])<58).sort((a,b)=>b.big-a.big);
  for(const o of tw){ const [x,y]=o.xy, w=o.n.length*(o.big?2.3:1.9)+2, h=o.big?5:4.2, bx=[x+1.6,y-h+1,w,h];
    if(Math.hypot(x,y)<4) continue;
    if(!fits(bx)){ s+=`<circle class="tw" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r=".7"/>`; continue; }
    boxes.push(bx);
    s+=`<circle class="tw" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${o.big?1.2:.8}"/><text class="tl${o.big?' big':''}" x="${(x+1.8).toFixed(1)}" y="${(y+1.3).toFixed(1)}">${esc(o.n)}</text>`; }
  for(const [w0,pts,name] of LM.rivers){ if(!name) continue; const inside=pts.map(q=>loc(q[0],q[1])).filter(q=>Math.hypot(q[0],q[1])<46);
    if(!inside.length) continue; const [x,y]=inside[Math.floor(inside.length/2)], nm=riverName(name), w=nm.length*1.8+1, bx=[x+1.5,y-2.5,w,3.4];
    if(tw.some(o=>o.n.toLowerCase()===nm.toLowerCase())) continue;
    if(!fits(bx)) continue; boxes.push(bx); s+=`<text class="rvl" x="${(x+1.5).toFixed(1)}" y="${(y+.6).toFixed(1)}">${esc(nm)}</text>`; }
  // villages and city neighbourhoods from the place list, nearest first, as many as fit
  if(VIL){ const townSet=new Set([...LM.towns.map(tn=>townName(tn[0]).toLowerCase()),...(KD||[]).map(k=>(LANG==='uk'?k.uk.replace(/\s*район$/,''):k.name).toLowerCase())]);
    const vs=VIL.map(v=>({v,xy:loc(v.lon,v.lat)})).map(o=>({...o,r:Math.hypot(o.xy[0],o.xy[1])})).filter(o=>o.r<56&&o.r>4).sort((a,b)=>a.r-b.r);
    let n=0; for(const o of vs){ if(n>=28) break; const nm=LANG==='uk'?o.v.name:pn(o.v.name); if(townSet.has(nm.toLowerCase())) continue;
      const [x,y]=o.xy, w=nm.length*1.6+1.5, bx=[x+1.2,y-2.3,w,3.3]; if(!fits(bx)) continue; boxes.push(bx); n++;
      s+=`<circle class="vd" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r=".55"/><text class="vl" x="${(x+1.2).toFixed(1)}" y="${(y+.9).toFixed(1)}">${esc(nm)}</text>`; } }
  return s;
}

function paintSlots(){
  $('slots').innerHTML=SLOT_IDS.map(id=>{const p=SLOTS[id];
    return `<button data-s="${id}" class="${id===ACTIVE&&p?'on':''}${p?'':' empty'}">${SLOT_ICO[id]}<span>${esc(t('sl_'+id))}</span></button>`;}).join('');
}

function paint(){
  paintSlots();
  const p=place();
  $('disc').textContent=t('lt_disc'); $('full').textContent=t('lt_full')+' →';
  $('swl').textContent=t('sw_light'); $('swt').textContent=t('sw_tac'); $('sw').title=t('sw_title');
  $('swl2').textContent=t('sw_light_b'); $('swt2').textContent=t('sw_tac_b');
  if(!p){ $('status').className='status U'; $('status').innerHTML=`<div class="big">${esc(t('lt_noplace'))}</div><div class="pl">${esc(t('lt_noplace_b'))}</div>`;
    $('radar').innerHTML=''; $('list').innerHTML=''; $('imm').hidden=true; return; }

  // the status: official data only, for the place's own raion
  if(!OBL&&PR===null){ $('status').className='status U'; $('status').innerHTML=`<div class="big">…</div><div class="pl">${esc(placeName(p))}</div>`; }
  else {
    const uid=OBL||'31', s=placeStatus(uid,PR);
    const unit=PR&&PR.length?PR.map(unitName).join(' / '):'';
    const where=[placeName(p),unit,uid!=='31'&&OBL_N[uid]?(typeof oblFull==='function'?oblFull(uid):OBL_N[uid][0]):''].filter(Boolean).join(' · ');
    const lvl=s.lvl==='yellow'?(LANG==='uk'&&s.reason?s.reason:t('lt_lv_yel')):s.lvl==='red'?(LANG==='uk'&&s.reason?s.reason:t('lt_lv_red')):'';
    const aname=a=>a.location_type==='hromada'?t('lt_hrom',LANG==='uk'?a.location_title:(a.location_title_en||pn(a.location_title)))
      :a.location_type==='raion'?(LANG==='uk'?a.location_title:t('lt_unit_r',RAION_N[a.raion_key]?raionName(a.raion_key):(a.location_title_en||pn(a.location_title)).replace(/\s+(district|район)$/i,'')))
      :(a.oblast_uid==='31'?t('b_kyiv'):(typeof oblFull==='function'?oblFull(a.oblast_uid):a.location_title));
    const near=(s.others||[]).slice(0,4).map(a=>`<b class="${a.alert_level==='yellow'?'Y':'R'}">${esc(aname(a))}</b>`).join(', ')+((s.others||[]).length>4?' …':'');
    $('status').className='status '+s.k;
    $('status').innerHTML=`<div class="big">${esc(t('lt_'+s.k))}</div><div class="pl">${esc(where)}${s.since?' · '+esc(t('lt_since',fmtT(s.since))):''}</div>`
      +(lvl?`<div class="lv">${esc(lvl)}</div>`:'')
      +(s.k==='H'||s.k==='P'?`<div class="lv">${s.part.map(a=>esc(aname(a))).join(', ')}</div>`:'')
      +(s.mirror?`<div class="oo">${esc(t('lt_obl_only'))}</div>`:'')
      +(near?`<div class="nb">${t('lt_nearby',near)}</div>`:'')
      +`<div class="src">${esc(t('lt_src'))}${OBL_GUESS?' · '+esc(t('lt_obl_unknown')):''}</div>`;
  }

  // what is near the place
  const live=link(MKS.map(m=>({...m})));
  const rows=[], far=[], imm=[];
  for(const m of live){ if(m.lat==null||m.lon==null) continue;
    const d=km(p.lat,p.lon,m.lat,m.lon);
    if(IMMEDIATE.has(m.type)){ if(d<=REGION_R) imm.push(m); continue; }
    const toHere=statedCourse(m)&&(d<=10||angDiff(m.heading,brg(m.lat,m.lon,p.lat,p.lon))<=28);
    let eta=null; const bd=band(m);
    if(toHere&&bd&&!m.stale&&d>1){ const lo=Math.floor(d/bd[1]),hi=Math.ceil(d/bd[0]); if(hi<=90) eta=[lo,hi]; }
    const r={m,d,zone:zoneOf(d),toHere,eta};
    if(d<=R_KM) rows.push(r);
    else if(toHere&&!m.stale&&d<=FAR_KM) far.push(r);   // beyond the radius: only what a post says is coming here
  }
  rows.sort((a,b)=>a.d-b.d); far.sort((a,b)=>a.d-b.d);
  rows.forEach((r,i)=>r.no=i+1);

  // weapons that outrun a radius: named, no distance, no countdown
  if(imm.length){ const m=imm[0]; $('imm').hidden=false;
    $('imm').innerHTML=`<b>🚨 ${esc(t('n_imm',label(m)))}</b><small>${esc(t('n_imm_b'))}</small>`; }
  else $('imm').hidden=true;

  const ALTL={descending:t('alt_desc_l'),climbing:t('alt_climb'),low:t('alt_low'),high:t('alt_high')};
  // the radar: the place in the middle, north up, over a small map of the 30 km around it
  const kx=111*Math.cos(rad(p.lat)), loc=(lon,lat)=>[(lon-p.lon)*kx*S,-(lat-p.lat)*111*S];
  let g=`<defs><clipPath id="disc"><circle r="60"/></clipPath></defs><circle class="bg" r="60"/>`
    +`<g clip-path="url(#disc)">${mapLayer(p,kx,loc)}</g>`
    +[10,20,30].map(k=>`<circle class="ring${k===10?' r10':''}" r="${k*S}"/><text class="rl" x="1.5" y="${(-k*S-.8).toFixed(1)}">${k}</text>`).join('')
    +`<text class="nn" x="-1.4" y="-62.5">N</text><circle class="me" r="1.8"/>`;
  const CRI=getComputedStyle(document.documentElement).getPropertyValue('--cri').trim(), ORA=getComputedStyle(document.documentElement).getPropertyValue('--ora').trim();
  for(const r of rows){ const m=r.m, [x,y]=loc(m.lon,m.lat), c=r.toHere?CRI:colOf(m), gone=m.stale?' gone':'';
    // where it was reported before: reported points joined, nothing drawn ahead of it
    if(m.history&&m.history.length){ const pts=[...m.history.filter(h=>h.lon!=null&&h.lat!=null).map(h=>loc(h.lon,h.lat)),[x,y]];
      if(pts.length>1) g+=`<polyline class="tail${gone}" stroke="${c}" points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`; }
    const T=`translate(${x.toFixed(1)} ${y.toFixed(1)})`;
    // the weapon's own silhouette, as on the Tactical map; turned only to a course the post reported
    // missiles are slender shapes: drawn a little larger so they read at this size as well as a Shahed does
    const sc=/missile/.test(m.type)&&m.type!=='banderol_missiles'?.42:.34;
    g+=`<g class="t${gone}" transform="${T} rotate(${markOrient(m)}) scale(${sc})"><g class="${silCls(m)}" style="--c:${c}">${G[silKey(m)]||''}</g></g>`;
    if(m.type==='unknown'){
      // nobody said what it is: the warning sign stays upright; a reported course is a small orange arrow beside it
      if(statedCourse(m)) g+=`<path class="t${gone}" transform="${T} rotate(${m.heading}) translate(0 -5.6)" d="M0 -1.8 L1.5 1.2 L0 .5 L-1.5 1.2 Z" fill="${ORA}"/>`;
    } else if(!statedCourse(m)) g+=`<text class="qm" x="${x.toFixed(1)}" y="${(y-4.4).toFixed(1)}">?</text>`;   // upright because no course was reported
    // its number in the list below, and how many
    g+=`<text class="no" x="${(x+3.2).toFixed(1)}" y="${(y-2.2).toFixed(1)}">${r.no}${m.count&&m.count>1?`<tspan fill="${c}"> ×${m.count}</tspan>`:''}</text>`;
    // the stated height under it; ↓ in crimson when a post said it is descending or reported it lower
    { const tr=altTrend(m), dsc=(m.alt&&m.alt.state==='descending')||(tr&&tr.dir==='down');
      const v=m.alt&&m.alt.m!=null?fmtAlt(m.alt.m):'', txt=(dsc?'↓':'')+(v||((m.alt&&m.alt.state&&!dsc)?(ALTL[m.alt.state]||''):''));
      if(txt) g+=`<text class="altl${dsc?' dsc':''}" x="${(x+3.2).toFixed(1)}" y="${(y+2.6).toFixed(1)}">${esc(txt)}</text>`; }
  }
  $('radar').innerHTML=g;
  $('lg').hidden=!LM; $('lg').textContent=t('lt_legend');

  // the list — each row opens on a tap: what the post said, the track so far, the source
  const row=({m,d,zone,toHere,eta,no})=>{
    const n=(m.count&&m.count>1)?' ×'+m.count:'';
    const bits=[zone?t('lt_z_'+zone):t('lt_far')]; if(toHere) bits.push(`<b class="hr">${esc(t('lt_here'))}</b>`);
    if(m.place) bits.push(`<span class="wh">${esc(t('lt_at',pn(m.place)))}</span>`);
    if(statedCourse(m)) bits.push(esc(t('lt_course',DIRS[Math.round(m.heading/45)%8])));
    // Height, only when a post stated it — a low or falling drone can be diving. Shown on the row itself,
    // not behind a tap: descending in crimson; a run of stated heights as "↓ 2,2 км → 800 м".
    const tr=altTrend(m);
    if(m.alt&&m.alt.state==='descending') bits.push(`<b class="dsc">↓ ${esc(t('alt_desc_l'))}${m.alt.m!=null?' · '+esc(fmtAlt(m.alt.m)):''}</b>`);
    else if(tr) bits.push(`<b class="${tr.dir==='down'?'dsc':'alt'}">${esc(tr.text)}</b>`);
    else if(m.alt&&m.alt.m!=null) bits.push(`<b class="alt">${esc(t('lt_alt_at',fmtAlt(m.alt.m)))}</b>`);
    else if(m.alt&&m.alt.state) bits.push(`<b class="alt">${esc(ALTL[m.alt.state]||m.alt.state)}</b>`);
    bits.push(m.stale?`${esc(t('lt_lost'))} · ${esc(t('tp_ago',m.stale))}`:esc(t('tp_ago',agoMin(m.ts))));
    const said=LANG==='uk'?m.text:((LANG==='fr'&&m.text_fr)||m.text_en||m.text);
    const track=(m.history||[]).filter(h=>h.place).slice(-4).map(h=>`${esc(pn(h.place))} ${fmtT(h.ts)}`);
    const alt=m.alt?[m.alt.state?(ALTL[m.alt.state]||m.alt.state):'',m.alt.m!=null?fmtAlt(m.alt.m):''].filter(Boolean).join(' · '):'';
    const open=OPEN.has(m.id);
    return `<div class="row${toHere?' here':''}${m.stale?' gone':''}${open?' open':''}" data-id="${esc(m.id)}"><div class="ic">${icoSvg(m,toHere?getComputedStyle(document.documentElement).getPropertyValue('--cri').trim():colOf(m))}</div><div class="bd">`
      +`<div class="l1"><b>${no?`<span class="no">${no}</span>`:''}${esc(label(m))}${n}</b><span class="d">${Math.round(d)} ${esc(t('lt_km'))}</span></div>`
      +`<div class="l2">${bits.map(x=>x.startsWith('<')?x:esc(x)).join(' · ')}</div>`
      +(eta?`<div class="l3"><b>${esc(t('eta_band',eta[0],eta[1]))}</b> <span>${esc(t('eta_if'))}</span></div>`:'')
      +`<div class="more">${said?`<q>«${esc(said)}»</q>`:''}${LANG!=='uk'&&m.text&&said!==m.text?`<span class="orig">${esc(m.text)}</span>`:''}`
      +(track.length?`<div>${esc(t('lt_track'))}: ${track.join(' → ')} → <b>${esc(pn(m.place||'?'))} ${fmtT(m.ts)}</b></div>`:'')
      +(alt||tr?`<div>${esc(t('lt_alt'))}: ${esc(tr?tr.text:alt)}${tr&&alt?' · '+esc(alt):''} <span>(${esc(t('alt_src'))})</span></div>`:'')
      +`<div>${esc(t('lt_src2'))}: @${esc(m.channel||'?')} · ${fmtT(m.ts)}</div></div>`
      +(open?'':`<div class="tap">${esc(t('lt_tap'))}</div>`)
      +`</div></div>`; };
  $('list').innerHTML=(rows.length?rows.map(row).join(''):`<div class="none"><b>${esc(t('lt_none'))}</b><small>${esc(t('lt_none_b'))}</small></div>`)
    +(far.length?`<div class="sec">${esc(t('lt_appr'))}</div>`+far.map(row).join(''):'');

  // a buzz for something new inside 10 km, or anything that outruns a radius — once per target
  for(const r of rows) if(r.zone==='near'&&!SEEN.has(r.m.id)){ SEEN.add(r.m.id); if(navigator.vibrate) navigator.vibrate([200,100,200]); }
  for(const m of imm) if(!SEEN.has(m.id)){ SEEN.add(m.id); if(navigator.vibrate) navigator.vibrate([300,80,300,80,300]); }
}

// a row opens and closes on a tap; the page repaints every 15 s, so which rows are open is remembered
const OPEN=new Set();
$('list').addEventListener('click',e=>{ const r=e.target.closest('.row[data-id]'); if(!r) return;
  const id=r.dataset.id; if(OPEN.has(id)) OPEN.delete(id); else OPEN.add(id); r.classList.toggle('open'); const tp=r.querySelector('.tap'); if(tp) tp.remove(); });

async function refresh(){
  try{
    const [a,b]=await Promise.all([fetch('/api/state',{cache:'no-store'}),fetch('/api/markers',{cache:'no-store'})]);
    STATE=await a.json(); MKS=((await b.json()).markers)||[]; LAST_OK=Date.now(); $('off').hidden=true;
  }catch(e){ if(Date.now()-LAST_OK>60000){ $('off').hidden=false; $('off').textContent=t('lt_offline'); } }
  $('up').textContent=LAST_OK?t('lt_upd',fmtT(new Date(LAST_OK).toISOString())):'';
  paint();
}

let PR=null;   // the raion(s) of the place
async function usePlace(){ const p=place(); OBL=null; OBL_GUESS=false; PR=null;
  paint();                                   // the status first, the outlines after
  if(!p) return;
  await loadLM(); PR=raionsOf(p);
  if(PR&&PR.length) OBL=PR[0].obl;
  else { OBL=await oblastOf(p); if(!OBL){ OBL='31'; OBL_GUESS=true; } }
  paint();
  await loadExtras(); paint(); }

// ---- choosing a place ------------------------------------------------------------------------------------
let PICK=null, PLACES=null;
async function openPick(slot){ PICK=slot; $('pick').classList.add('show');
  $('pickh').textContent=SLOT_ICO[slot]+' '+t('sl_'+slot); $('pickp').textContent=t('lt_noplace_b');
  $('pickq').placeholder=t('lt_search'); $('pickq').value=''; $('pickloc').textContent=t('lt_locate');
  if(!PLACES){ try{ PLACES=(await (await fetch('/api/places?oblast=31,14,10,25,19,24,4,20')).json()).places
      .filter(x=>!/громада|берег|столиця|водосховище|море|АЕС|ГЕС|траса|шосе|проспект/i.test(x.name)); }catch(e){ PLACES=[]; } }
  listPick(''); setTimeout(()=>$('pickq').focus(),80); }
function listPick(q){ const s=q.trim().toLowerCase();
  const r=(PLACES||[]).filter(x=>!s||x.name.toLowerCase().includes(s)).slice(0,60);
  $('pickres').innerHTML=r.map((x,i)=>`<button data-i="${PLACES.indexOf(x)}">${esc(x.name)}<small>${esc(OBL_N[x.oblast_uid]?(typeof oblFull==='function'?oblFull(x.oblast_uid):''):'')}</small></button>`).join(''); }
function setPlace(p){ SLOTS[PICK]=p; ACTIVE=PICK; save(); $('pick').classList.remove('show'); usePlace(); }
$('pickq').addEventListener('input',e=>listPick(e.target.value));
$('pickres').addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(!b) return; const x=PLACES[+b.dataset.i];
  setPlace({name:x.name,uk:x.name,lon:x.lon,lat:x.lat,obl:x.oblast_uid});});
$('pickloc').onclick=()=>{ if(!navigator.geolocation){ $('pickloc').textContent=t('lt_locate_fail'); return; }
  $('pickloc').textContent=t('lt_locating');
  navigator.geolocation.getCurrentPosition(pos=>setPlace({lon:+pos.coords.longitude.toFixed(4),lat:+pos.coords.latitude.toFixed(4),dropped:true}),
    ()=>{ $('pickloc').textContent=t('lt_locate_fail'); },{enableHighAccuracy:false,timeout:12000,maximumAge:300000}); };
$('pickx').onclick=()=>$('pick').classList.remove('show');

// tap a place to watch it; tap an empty one — or hold any — to set it
(()=>{ let hold=null, held=false;
  $('slots').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-s]'); if(!b) return; held=false;
    hold=setTimeout(()=>{held=true; openPick(b.dataset.s);},550);});
  const stop=()=>{clearTimeout(hold);hold=null;};
  $('slots').addEventListener('pointerup',e=>{stop(); const b=e.target.closest('[data-s]'); if(!b||held) return;
    const id=b.dataset.s; if(SLOTS[id]){ACTIVE=id; save(); usePlace();} else openPick(id);});
  $('slots').addEventListener('pointercancel',stop); $('slots').addEventListener('pointerleave',stop); })();

// the notice, once per opening of the app (the Tactical page reads the same flag)
(()=>{ let seen=false; try{ seen=sessionStorage.getItem('disc_seen')==='1'; sessionStorage.setItem('disc_seen','1'); }catch(e){}
  if(seen) return;
  $('dmt').textContent=t('d_title'); ['dm1','dm2','dm3'].forEach((id,i)=>{ $(id).innerHTML=t('d_p'+(i+1)); });
  $('dmok').textContent=t('d_ok'); $('dm').hidden=false; $('dmok').onclick=()=>{ $('dm').hidden=true; }; })();
usePlace(); refresh(); setInterval(refresh,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
</script>
