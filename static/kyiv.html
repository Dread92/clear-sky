<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/logo-64.png"><link rel="apple-touch-icon" href="/static/logo-192.png">
<title>Clear Sky</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--top:86px;--peek:40px;--bg:#0b0d11;--ink:#e8e6df;--ink2:#a9a79f;--ink3:#6c6b66;--line:#242830;--panel:#12151b;--panel2:#181c24;
  --ua-blue:#0057b7;--ua-yellow:#ffd500;--red:#e0342c;--red2:#ff5b52;--yellow:#f2c200;--green:#2fbf71;--orange:#ff8a3d;--purple:#b07cff;--blue:#5b9cff;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans);overscroll-behavior:none;overflow:hidden}
body{padding-top:var(--sat)}
button{font:inherit;cursor:pointer}
/* ---------- top strip ---------- */
#top{position:fixed;left:0;right:0;top:var(--sat);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#top .r1{height:40px;display:flex;align-items:center;gap:10px;padding:0 10px 0 8px;border-bottom:1px solid var(--line)}
#top .logo{width:28px;height:28px;flex:none}
#top .name{font:700 17px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.menu{position:absolute;right:8px;top:44px;background:#14171d;border:1px solid var(--line);display:flex;flex-direction:column;min-width:230px;z-index:25;box-shadow:0 8px 24px #0009}
.menu[hidden]{display:none}
.ticker{height:18px;overflow:hidden;background:#0f1218;border-bottom:1px solid var(--line);font:600 10.5px/18px var(--mono);color:#b9c2d0;letter-spacing:.03em;white-space:nowrap}
.ticker .tk{display:inline-block;animation:tkscroll 55s linear infinite}.ticker .tk span{padding-right:40px}@keyframes tkscroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.upd .cd{display:inline-block;min-width:26px;color:var(--ua-yellow);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(5,7,10,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}.modal[hidden]{display:none}
.mbox{background:#14171d;border:1px solid var(--line);border-top:3px solid var(--ua-yellow);max-width:480px;max-height:calc(100vh - 32px - var(--sat) - var(--sab));overflow:auto;padding:16px 18px;font:14px/1.45 var(--sans);color:var(--ink)}.mbox p{margin:8px 0}.mbox .type{font:700 20px var(--cond);text-transform:uppercase;letter-spacing:.03em}
.sbars{display:flex;align-items:flex-end;gap:2px;height:46px;margin-top:4px}.sbars .sb{flex:1;min-width:2px;border-radius:1px 1px 0 0;opacity:.9}.sbars.h24 .sb{min-width:4px}
.sdays{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--muted);margin-top:2px}.sdays span{flex:1;text-align:center}.sdays span:first-child{text-align:left}.sdays span:last-child{text-align:right}
.slbl{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.srow{display:flex;gap:10px;font:500 12.5px var(--sans);padding:3px 0;border-bottom:1px solid var(--line)}.srow span{flex:1}.srow b{min-width:44px;text-align:right}
.sfoot{font:11.5px var(--sans);color:var(--muted);margin-top:10px;line-height:1.35}
.sbars .sb2{flex:1;min-width:2px;display:flex;align-items:flex-end;gap:1px;height:100%}.sbars .sb2 i{flex:1;display:block;border-radius:1px 1px 0 0;opacity:.9}
.wtab .srow b{text-align:right}.wtab .srow span{font-weight:500}
.mi[hidden]{display:none}
.dset{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}.dset label{display:flex;flex-direction:column;gap:4px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}.dset select{width:100%;padding:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:14px var(--sans);border-radius:2px}.dset .tgl{align-self:flex-start;text-transform:none;letter-spacing:0;font:600 13px var(--sans)}
.kv1{font:500 13.5px/1.35 var(--sans);margin-top:5px}.kv1.muted{color:var(--muted);font-size:12.5px}.kv1.green{color:#a8f0cf}.kv1.yellow{color:#ffd166}.kv1 a{color:#8fb4ff}
.sheet .type{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tstrip{font:700 12px/1.25 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;background:#3a1030;color:#ffd0f0;border-bottom:1px solid #7a2a6a;animation:tpulse 1.6s ease-in-out infinite}.tstrip small{font:600 10.5px var(--mono);color:inherit;opacity:.8;text-transform:none;letter-spacing:0}
.tstrip.bal{background:#4a0d12;color:#ffd6d6;border-color:#8a2a2a}.tstrip.mig{background:#2b1440;color:#e9d6ff;border-color:#5f2f8a}.tstrip[hidden]{display:none}
@keyframes tpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.mi{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;padding:11px 14px;font:500 13px var(--sans)}.mi:last-child{border-bottom:0}.mi.on::after{content:' ✓';color:var(--ua-yellow)}
#top .name small{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);margin-top:3px}
.srcs{display:flex;gap:4px;margin-left:2px;align-items:center}.srcs i{width:6px;height:6px;background:var(--ink3);display:inline-block}.srcs i.ok{background:var(--green)}.srcs i.warn{background:var(--yellow)}.srcs i.bad{background:var(--red)}.srcs .sn{font:600 10px var(--mono);color:var(--ink3);letter-spacing:.02em}@media (max-width:999px){.srcs .sn{display:none}}
#top .sp{flex:1}
#top .clock{font:600 13px var(--mono);color:var(--ink2);white-space:nowrap;letter-spacing:.02em}
.ib{width:34px;height:30px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:2px;font:600 12px var(--mono);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib.on{color:var(--ua-yellow);border-color:#5a4d00;background:#1e1a05}
/* status band = #kyiv (filled by render) */
.band{height:28px;display:flex;align-items:center;gap:10px;padding:0 10px;background:#1a2a1f;border-left:6px solid var(--green);position:relative}
.band.R,.band.A{background:#3a1512;border-left-color:var(--red)}.band.Y,.band.P{background:#3a2f08;border-left-color:var(--yellow)}.band.N{background:#0f2418;border-left-color:var(--green)}
.band .dot{display:none}.band>div:not(.dur):not(.dot){flex:1;min-width:0}
.band .big{font:700 14px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .small{font:500 10px/1.1 var(--mono);color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .dur{margin-left:auto;font:600 13px/1 var(--mono);white-space:nowrap}
.band.R .big,.band.A .big{color:#ffd9d6}.band.Y .big,.band.P .big{color:#ffefa8}.band.N .big{color:#c9f2da}
/* clear state: no sub-line */
.band.N .small,.band.N .dur{display:none}
/* ---------- map ---------- */
#stage{position:fixed;left:0;right:0;top:calc(var(--sat) + var(--top));bottom:calc(var(--peek) + var(--sab))}
.mapwrap{position:absolute;inset:0;background:#0a0c10;touch-action:none;user-select:none;overflow:hidden}
svg#map{display:block;width:100%;height:100%}
/* situation overlay (raions + home) */
#situ{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 60px);pointer-events:none}
#situ>*{pointer-events:auto}
#raions{display:flex;gap:3px;flex-wrap:wrap}#raions[hidden]{display:none}
@media (max-width:999px){#raions{flex-wrap:nowrap;overflow-x:auto;max-width:calc(100vw - 60px);scrollbar-width:none;-webkit-overflow-scrolling:touch}#raions::-webkit-scrollbar{display:none}#raions .rt{white-space:nowrap;flex:0 0 auto}}
.rt.rg{opacity:.8;font-size:9.5px}.rt i{font-style:normal;color:#ffc9a3;margin-left:3px}
.rt{font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;background:rgba(18,21,27,.92);border:1px solid var(--line);color:var(--ink2);border-left:3px solid var(--green)}
.rt.R{border-left-color:var(--red);color:#ffd9d6;background:rgba(58,21,18,.92)}.rt.Y{border-left-color:var(--yellow);color:#ffefa8;background:rgba(58,47,8,.92)}
.rt.note{border-left-color:var(--ink3);color:var(--ink3)}
.homerow{font:500 11.5px/1.3 var(--sans);padding:5px 8px;background:rgba(18,21,27,.92);border:1px solid var(--line);border-left:3px solid var(--ua-blue);max-width:min(360px,calc(100vw - 60px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homerow.danger{border-left-color:var(--red2);background:rgba(58,21,18,.94)}.homerow b{font-weight:600}
.livebar{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 60px);pointer-events:none}
.livebar .chip{font:600 11px/1 var(--mono);letter-spacing:.03em;padding:6px 8px;white-space:nowrap;background:rgba(18,21,27,.92);border:1px solid var(--line);color:var(--ink2);border-radius:0}
.livebar .chip.red{color:#ffd9d6;border-color:#6a2a26}.livebar .chip.orange{color:#ffc9a3}.livebar .chip.green{color:#c9f2da}.livebar .chip.yellow{color:#ffefa8}.livebar .chip.blue{color:#bcd5ff}
.livebar .chip b{font-weight:600}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px}
.mapctl button{width:34px;height:34px;border:1px solid var(--line);background:rgba(18,21,27,.94);color:var(--ink);border-radius:2px;font:600 15px var(--mono);padding:0}
.mapctl button.on{color:var(--ua-yellow);border-color:#5a4d00}
#impbtn{position:relative;color:#ff8a80}#impbtn:not(.on){color:#8f9bb0}#impbtn small{position:absolute;right:2px;bottom:1px;font:600 8.5px var(--mono);color:var(--ua-yellow)}
.imp{cursor:pointer}.imp .ig{fill:#ff5a4e;stroke:#080b10;stroke-width:calc(var(--k,1)*1px)}.imp .ir{fill:none;stroke:#ff5a4e;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
.imp .it{font:600 calc(var(--k,1)*9.5px) system-ui;fill:#ffb3ad;paint-order:stroke;stroke:#080b10;stroke-width:calc(var(--k,1)*3px)}svg.far .imp .it{display:none}
.imp.d1{opacity:.75}.imp.d2{opacity:.5}
.imp.dn .ig{fill:#39d98a}.imp.dn .ir{stroke:#39d98a}.imp.dn .it{fill:#b8f0d3}svg.no-himp .imp.im,svg.no-hdown .imp.dn{display:none}
.mapfoot{display:none}
.tip{position:absolute;z-index:6;max-width:300px;background:rgba(18,21,27,.98);border:1px solid var(--line);border-left:3px solid var(--orange);padding:8px 10px;font-size:12.5px;pointer-events:none}
.tip b{display:block;font:700 15px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}.tip .m{color:var(--ink2);font-family:var(--mono);font-size:11px}.tip .q{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);white-space:pre-wrap}
/* ---------- drawer ---------- */
#drawer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);height:var(--peek);transition:height .25s;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#drawer.open{height:72%}
#drawer .handle{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;cursor:pointer;flex:none;border-bottom:1px solid var(--line)}
#drawer .handle .bar{width:36px;height:3px;background:var(--ink3);margin:0 auto;position:absolute;left:50%;transform:translateX(-50%);top:6px}
.tabs{display:flex;gap:14px}
.tabs button{border:0;background:transparent;color:var(--ink3);font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:0;height:30px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ua-yellow)}
.upd{font:500 10.5px var(--mono);color:var(--ink3)}
#drawer .body{flex:1;overflow:auto;min-height:0}
.sec{padding:8px 12px}
.filters{display:flex;gap:2px;margin-bottom:8px}
.filters .chip{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);background:transparent;color:var(--ink3);cursor:pointer}
.filters .chip.on{color:var(--ink);background:var(--panel2);border-color:#3a3f4a}
.card{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.card .when{flex:none;width:56px;font:600 11px/1.45 var(--mono);color:var(--ink3);word-break:break-word}
.card .when b{display:block;color:var(--ink2);font-weight:500;font-size:10px;letter-spacing:.02em;line-height:1.3;margin-top:2px}
.card .bd{flex:1;min-width:0}
.card .txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:14px;line-height:1.4}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.card .tags span{font:500 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);padding:1px 5px}
.card .tags span.kyiv{color:#bcd5ff;border-color:#2b4370}
.card.kyiv{border-left:3px solid var(--ua-blue);padding-left:8px}
.card.red{border-left:3px solid var(--red);padding-left:8px}.card.yellow{border-left:3px solid var(--yellow);padding-left:8px}
.card.plain{display:block}.card .title{font:700 15px var(--cond);letter-spacing:.02em}.card .meta{font:500 11.5px var(--mono);color:var(--ink2);margin-top:2px}
.card.new{animation:flash 2.5s ease-out}
@keyframes flash{0%{background:rgba(255,213,0,.18)}100%{background:transparent}}
.empty{color:var(--ink3);font-family:var(--mono);font-size:12px;padding:12px 4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat .v{font:700 24px/1 var(--cond)}.stat .l{font:500 10px var(--mono);color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.track{position:relative;height:16px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar{position:absolute;top:2px;bottom:2px;background:var(--red)}
.ticks{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink3);margin-top:3px}
.foot{padding:10px 12px 14px;font:11px/1.45 var(--mono);color:var(--ink3)}
.layermenu{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;border-bottom:1px solid var(--line);font:500 11px var(--mono);color:var(--ink2)}
.layermenu label{display:flex;gap:5px;align-items:center;white-space:nowrap}.layermenu .lbl{color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
/* sheets & toast */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#14171d;border-top:2px solid var(--ua-yellow);padding:12px 14px calc(14px + var(--sab));transform:translateY(105%);transition:transform .22s;max-height:82vh;overflow:auto}
.sheet.show{transform:none}
.sheet .grab{display:none}
.sheet .type{font:800 22px/1.05 var(--cond);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:8px 0;color:var(--ink3)}
.sheet .kv>span{font:600 10.5px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sheet .kv b{color:var(--ink);font-weight:600}
.sheet .txt{background:var(--panel);border-left:3px solid var(--line);padding:8px 10px;font-size:14px;white-space:pre-wrap}
.sheet a{color:#8fb4ff;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 10.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);color:var(--ink2)}
.chip.red{color:#ffd9d6;border-color:#6a2a26}.chip.yellow{color:#ffefa8;border-color:#5a4d00}.chip.green{color:#c9f2da;border-color:#1f5a3a}.chip.blue{color:#bcd5ff;border-color:#2b4370}.chip.orange{color:#ffc9a3}
.tgl{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:2px;padding:6px 10px;font:600 12px var(--mono)}
.tgl.on{color:var(--ua-yellow);border-color:#5a4d00}
.hitem{padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;font-size:14px}.hitem:hover{background:var(--panel2)}.hitem span{color:var(--ink3);font:500 11px var(--mono)}
#homeq{width:100%;padding:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:15px var(--sans);border-radius:2px}
.toast{position:fixed;left:10px;right:10px;top:calc(var(--sat) + var(--top) + 8px);z-index:40;background:#14171d;border:1px solid var(--line);border-left:4px solid var(--red);padding:10px 12px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.show{display:block}.toast b{font:700 16px/1.1 var(--cond);text-transform:uppercase;letter-spacing:.03em}
@media (max-width:520px){
  #top .name small{display:none}#top .name{font-size:15px}#top .clock{font-size:11px}.ib{width:30px;height:28px;font-size:11px}#top .r1{gap:6px}
  .band .big{font-size:13px}.band .dur{font-size:12px}
}
/* ---------- desktop ---------- */
@media (min-width:1000px){
  :root{--peek:0px}
  #stage{right:380px}
  .toast{top:auto;bottom:64px;left:16px;right:auto;width:360px}
  #drawer{left:auto;width:380px;top:calc(var(--sat) + var(--top));height:auto!important;border-top:0;border-left:1px solid var(--line)}
  #drawer .handle{cursor:default}#drawer .handle .bar{display:none}
  .band .small{max-width:none}.band .big{max-width:none}
}
/* ---------- map (svg) ---------- */
svg#map{display:block;width:100%;height:min(64vh,560px)}
.nb{fill:#0e1116;stroke:#1a1f28;stroke-width:1px;vector-effect:non-scaling-stroke;transition:fill .5s}
.nb.R{fill:rgba(229,72,77,.34)}.nb.Y{fill:rgba(245,185,64,.22)}.nb.oR{fill:rgba(229,72,77,.11)}.nb.oY{fill:rgba(245,185,64,.08)}
.ob{fill:none;stroke:#2a3344;stroke-width:1.3px;vector-effect:non-scaling-stroke;transition:fill .5s}.ob.far{stroke:#1a2029;fill:#0b0d11}
.ob.region.R{fill:rgba(229,72,77,.10)}.ob.region.Y{fill:rgba(245,185,64,.07)}
.oblbl{fill:#3f4a5c;font:800 calc(var(--k,1)*13px) system-ui;text-transform:uppercase;letter-spacing:.6px;pointer-events:none}svg.close .oblbl{display:none}svg:not(.veryfar) .oblbl.faro{display:none}
.ob.occ{fill:url(#occ);stroke:#5a6272;stroke-dasharray:4 3}.nb.occ{fill:none;stroke:#3a4252}
.ob.far.R{fill:rgba(229,72,77,.12)}.ob.far.Y{fill:rgba(245,185,64,.08)}
.kozak{pointer-events:none}.kozak text{font:700 calc(var(--k,1)*9px) system-ui;fill:#ffd166;paint-order:stroke;stroke:#080b10;stroke-width:calc(var(--k,1)*3px);text-anchor:middle}.kozak .sub{fill:#c9d1de;font-weight:500}svg.close .kozak{display:none}
.nblbl{fill:#4a5568;font:700 calc(var(--k,1)*10px) system-ui;text-transform:uppercase;letter-spacing:.3px;pointer-events:none}svg.close .nblbl{display:none}
.town.rg{fill:#9aa5b8}svg.close .town.rg,svg.close .towndot.rg,svg.ua .town.rg,svg.ua .towndot.rg,svg.ua .town:not(.big):not(.uac),svg.ua .towndot:not(.big):not(.uac){display:none}
.town.uac{fill:#aeb8c8;font-size:calc(var(--k,1)*10.5px)}.town.uac:not(.show),.towndot.uac:not(.show){display:none}svg:not(.far) .town.uac,svg:not(.far) .towndot.uac{display:none}

// ---- statistics of past attacks (server-aggregated, Kyiv time) ----
let STATS=null,STAT_DAYS=14;
async function loadStats(){try{STATS=await(await fetch('/api/stats?days='+STAT_DAYS)).json();renderStats();}catch(e){}}
function renderStats(){ if(!STATS) return; const el=$('stats'); if(!el) return; const d=STATS; const ser=d.series; const mx=k=>Math.max(1,...ser.map(x=>x[k]||0));
  const bars=(k,color,cap)=>`<div class="sbars">${ser.map(x=>{const v=cap?Math.min(x[k]||0,cap):(x[k]||0);return `<div class="sb" title="${x.day}: ${Math.round(x[k]||0)}" style="height:${Math.max(2,v/Math.min(mx(k),cap||1e9)*100)}%;background:${color}"></div>`;}).join('')}</div>`;
  // two series side by side in one strip (drones + missiles), missiles scaled so both stay readable
  const bars2=(k1,c1,k2,c2,scale2)=>{const m=Math.max(1,mx(k1),mx(k2)*scale2);return `<div class="sbars">${ser.map(x=>`<div class="sb2" title="${x.day}: ${x[k1]||0} / ${x[k2]||0}"><i style="height:${Math.max(1,(x[k1]||0)/m*100)}%;background:${c1}"></i><i style="height:${Math.max(1,(x[k2]||0)*scale2/m*100)}%;background:${c2}"></i></div>`).join('')}</div>`;};
  const dayl=`<div class="sdays">${ser.map((x,i)=>`<span>${(i===0||i===ser.length-1||i%Math.ceil(ser.length/5)===0)?x.day.slice(5):''}</span>`).join('')}</div>`;
  const hmx=Math.max(1,...d.hours); const hours=`<div class="sbars h24">${d.hours.map((v,h)=>`<div class="sb" title="${h}:00 — ${v}" style="height:${Math.max(2,v/hmx*100)}%;background:${h>=22||h<6?'#ff8a3d':'#5b7fbf'}"></div>`).join('')}</div><div class="sdays"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>`;
  const lg=d.longest?`${Math.floor(d.longest[0]/60)}h${String(Math.round(d.longest[0]%60)).padStart(2,'0')} (${fmtT(d.longest[1])})`:'—';
  const obl=Object.entries(d.by_oblast||{}).sort((a,b)=>(b[1].impacts+b[1].down)-(a[1].impacts+a[1].down)).slice(0,8).map(([u,v])=>`<div class="srow"><span>${esc(OBL_N[u]?oblFull(u):(S?.oblasts?.[u]?.en||u))}</span><b style="color:#ffb3ad">✸ ${v.impacts}</b><b style="color:#a8f0cf">✕ ${v.down}</b></div>`).join('');
  const W=d.windows||{}; const wrow=(k,color)=>`<div class="srow"><span></span>${['1','7','30'].map(w=>`<b style="color:${color};min-width:52px">${(W[w]||{})[k]??'—'}</b>`).join('')}</div>`;
  const whead=`<div class="srow" style="border-bottom:0"><span></span>${[t('s_w1'),t('s_w7'),t('s_w30')].map(x=>`<b style="min-width:52px;color:var(--muted);font:600 10px var(--mono);text-transform:uppercase">${x}</b>`).join('')}</div>`;
  const wtab=(rows)=>`<div class="wtab">${whead}${rows}</div>`;
  const launched=wtab(wrow('launched_drones','#ffb15c').replace('<span></span>',`<span>🛸 ${t('s_ldr')}</span>`)+wrow('launched_missiles','#ff8a8a').replace('<span></span>',`<span>🚀 ${t('s_lms')}</span>`));
  const reports=wtab(wrow('drone_reports','#ffb15c').replace('<span></span>',`<span>🛸 ${t('s_rdr')}</span>`)+wrow('missile_reports','#ff8a8a').replace('<span></span>',`<span>🚀 ${t('s_rms')}</span>`));
  const noSum=!((W['30']||{}).summaries);
  el.innerHTML=`<div class="card plain"><div class="title">${t('s_title',d.days)}</div>
    <div class="stats" style="margin-top:6px"><div class="stat"><div class="v">${d.kyiv_alerts}</div><div class="l">${t('s_kalerts')}</div></div><div class="stat"><div class="v">${lg}</div><div class="l">${t('s_longest')}</div></div></div>
    <div class="stats" style="margin-top:6px"><div class="stat"><div class="v" style="color:#ffb3ad">${d.impacts_total}</div><div class="l">${t('s_expl',d.impact_window_h)}</div></div><div class="stat"><div class="v" style="color:#a8f0cf">${d.down_total}</div><div class="l">${t('s_down',d.impact_window_h)}</div></div></div>
    <div class="slbl">${t('s_launch')}</div>${noSum?`<div class="sfoot" style="margin-top:4px">${t('s_nosum')}</div>`:launched}
    <div class="slbl">${t('s_reports')}</div>${reports}
    ${noSum?'':`<div class="slbl">${t('s_lperday')}</div>${bars2('launched_drones','#ffb15c','launched_missiles','#ff8a8a',10)}${dayl}`}
    <div class="slbl">${t('s_rperday')}</div>${bars2('drone_reports','#ffb15c','missile_reports','#ff8a8a',1)}${dayl}
    <div class="slbl">${t('s_perday')}</div>${bars('alerts','#e5484d')}${dayl}
    <div class="slbl">${t('s_dkyiv')}</div>${bars('drone_posts','#ff8a3d')}${dayl}
    <div class="slbl">${t('s_mkyiv')}</div>${bars('missile_posts','#ff5a5a')}${dayl}
    <div class="slbl">${t('s_tod')}</div>${hours}
    ${obl?`<div class="slbl">${t('s_byobl',d.impact_window_h)}</div>${obl}`:''}
    <div class="sfoot">${t('s_foot')} <span class="chip" style="cursor:pointer" onclick="STAT_DAYS=STAT_DAYS===14?30:STAT_DAYS===30?7:14;loadStats()">${t('s_show',STAT_DAYS===14?'30':STAT_DAYS===30?'7':'14')}</span></div></div>`;
}

const DONATE='nomakievip@gmail.com';
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):(localStorage.setItem(k,v),v);}catch(e){return null;}};

// ---- 1. "you are running an old build" ------------------------------------------------
// The page keeps the build id it loaded with; /api/version carries the server's. When they differ the app has
// been updated under a page that may have been open for days — during an attack that page must not stay stale.
let MYBUILD=null, updShown=false;
function checkBuild(v){ if(!v||!v.build) return; if(MYBUILD===null){MYBUILD=v.build;$('buildtag2').textContent=v.build;return;}
  if(v.build===MYBUILD||updShown) return; updShown=true;
  $('updT').textContent=t('upd_title'); $('updB').textContent=t('upd_body'); $('updGo').textContent=t('upd_btn'); $('updbar').hidden=false;
  if(soundOn)beep('end'); }
$('updGo').onclick=async()=>{ try{ if('serviceWorker' in navigator){ const rs=await navigator.serviceWorker.getRegistrations(); for(const r of rs){ try{await r.update();}catch(e){} } } }catch(e){}
  location.reload(true); };
$('updX').onclick=()=>{$('updbar').hidden=true;};

// ---- 2. install as an app (PWA) --------------------------------------------------------
let deferredPrompt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function pwaSnoozed(){ const v=+(ls('pwa_no')||0); return Date.now()-v < 14*864e5; }
function showPwaBar(ios){ if(standalone()||pwaSnoozed()||!$('disc').hidden) return;
  if(!$('updbar').hidden){ setTimeout(()=>showPwaBar(ios),60000); return; }   // an update notice matters more
  $('pwaT').textContent=t('pwa_title'); $('pwaB').textContent=ios?t('pwa_ios'):t('pwa_body');
  $('pwaGo').textContent=ios?t('btn_close'):t('pwa_btn'); $('pwabar').hidden=false; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; setTimeout(()=>showPwaBar(false),15000); });
$('pwaGo').onclick=async()=>{ $('pwabar').hidden=true; if(deferredPrompt){ deferredPrompt.prompt(); try{await deferredPrompt.userChoice;}catch(e){} deferredPrompt=null; } };
$('pwaX').onclick=()=>{$('pwabar').hidden=true;ls('pwa_no',String(Date.now()));};
// iPhone gets no beforeinstallprompt event: show the Share → Add to Home Screen hint instead, once
if(isIOS()&&!standalone()) setTimeout(()=>showPwaBar(true),20000);

// a reminder at most once every 14 days, only after the app has actually been used, never during an alert

// ---- 4. copy / share the status of one target ------------------------------------------
async function copyText(txt,btn,okLabel){
  try{ await navigator.clipboard.writeText(txt); }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
  if(btn){const o=btn.textContent; btn.textContent=okLabel||t('share_copied'); setTimeout(()=>btn.textContent=o,1600);} }
function markerText(m){
  const kind=m.status?STATUS_EN[m.status]:(m.type==='drones'?(m.jet?t('k_jet'):t('k_shahed')):THREAT[m.type]?.[1]||m.type);
  const n=(m.csum||m.count||1)>1?` ×${m.csum||m.count}`:'';
  const place=m.place==='область'?t('oblcentre'):pn(m.place);
  const L=[`Clear Sky · ${kind}${n} — ${place} · ${fmtT(m.ts)}`];
  if(m.alt&&m.alt.state==='descending') L.push('↓ '+t('alt_desc'));
  if(m.alt&&m.alt.m) L.push(`~${m.alt.m} m`);
  if(m.heading!=null&&!m.status) L.push(`${t('tp_heading')}: ${dirName(m.heading)}`);
  if(HOME){const [x,y]=proj(m.lon,m.lat),[hx,hy]=proj(HOME.lon,HOME.lat);L.push(`${Math.round(Math.hypot(x-hx,y-hy))} km — ${homeName()}`);}
  L.push(`(${CH[m.channel]||'@'+m.channel})`);
  L.push(t('share_foot'));
  L.push(location.origin+'/m');
  return L.join('\n'); }
async function shareMarker(id,btn){ const m=MK.find(x=>x.id===id)||IMP.find(x=>x.id===id); if(!m) return; const txt=markerText(m);
  if(navigator.share){ try{ await navigator.share({text:txt}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
  copyText(txt,btn); }

// ---- 6. "warn me when something is reported within N km of me" ---------------------------
let GEO=null; try{GEO=JSON.parse(ls('geo')||'null');}catch(e){}
function geoSheet(){
  const R=[5,10,15,20,30,50]; const cur=GEO&&GEO.radius||15;
  $('sheetbody').innerHTML=`<div class="type">${t('geo_title')}</div>
    <div class="kv1 muted">${esc(t('geo_body'))}</div>
    <div class="kv1" style="margin-top:10px">${esc(t('geo_radius'))}</div>
    <div class="hlist" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${R.map(r=>`<button class="tgl ${r===cur?'on':''}" data-r="${r}">${r} km</button>`).join('')}</div>
    ${GEO?`<div class="kv1 green" style="margin-top:10px">${esc(t('geo_on',GEO.radius))}</div>`:''}
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:space-between">
      <button class="tgl on" id="geogo">${t('geo_btn')}</button>
      ${GEO?`<button class="tgl" id="geooff">${t('btn_clear')}</button>`:''}
      <button class="tgl" onclick="closeSheet()">${t('btn_close')}</button></div>`;
  let radius=cur;
  $('sheetbody').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{radius=+b.dataset.r;
    $('sheetbody').querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',+x.dataset.r===radius));});
  $('geogo').onclick=()=>{ if(!PUSH_SUB){notify(t('geo_title'),t('geo_need_push'),'threat');return;}
    navigator.geolocation.getCurrentPosition(async pos=>{
      GEO={lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),radius};
      ls('geo',JSON.stringify(GEO)); await pushSync(); closeSheet(); notify(t('geo_on',radius),'','end');
    },()=>notify(t('geo_deny'),'','threat'),{enableHighAccuracy:false,timeout:12000,maximumAge:300000}); };
  const off=$('geooff'); if(off) off.onclick=async()=>{GEO=null;try{localStorage.removeItem('geo');}catch(e){};await pushSync();closeSheet();notify(t('geo_off'),'','end');};
  $('sheet').classList.add('show'); }
// keep the server's copy of "where to warn me" in step with the local settings
async function pushSync(){ if(!PUSH_SUB) return;
  try{ await fetch('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:PUSH_SUB.toJSON(),home:Object.assign({name:HOME?HOME.name:null,raion:homeRaion()},GEO||{})})}); }catch(e){} }

let es; function connect(){ es=new EventSource('/api/stream');
  const onA=kind=>ev=>{const d=JSON.parse(ev.data),a=d.alert,fav=a.oblast_uid==='31'||a.oblast_uid==='14'; loadState(); if(kind!=='update')loadHist(); if(!fav)return;
    const lt=LANG==='uk'?a.location_title:(a.location_title_en||a.location_title);
    if(kind==='start')notify(`🔴 ${ATYPE[a.alert_type]||t('n_alert')} — ${lt}`,`${LT(a.location_type)} · ${fmtT(a.started_at)}${a.notes?' · '+a.notes:''}`,'start');
    else if(kind==='end')notify(`🟢 ${t('n_allclear')} — ${lt}`,t('n_lasted',dur(a.started_at,a.finished_at)),'end');
    else if(kind==='threat'){const th=d.threat||{};notify(`⚠️ ${THREAT[th.threat_type]?.[1]||th.threat_type} — ${lt}`,th.source_message||'','threat');}};
  ['start','end','threat','update'].forEach(k=>es.addEventListener(k,onA(k)));
  es.addEventListener('eradar',()=>loadState());
  es.addEventListener('feed',ev=>{const d=JSON.parse(ev.data);loadFeed(true);loadMarkers();if(!HOME&&(d.post.tags||[]).includes('kyiv')&&!(d.post.tags||[]).includes('official'))notify(t('n_kyivarea')+' — '+(CH[d.post.channel]||d.post.channel),ptxt(d.post).slice(0,160),'threat');});
  es.onerror=()=>{es.close();setTimeout(connect,3000);};
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['feedwrap','alerts','hist','layers'].forEach(x=>$(x).hidden=x!==b.dataset.tab);if(window.innerWidth<1000)$('drawer').classList.add('open');});
$('handle').onclick=()=>{if(window.innerWidth<1000)$('drawer').classList.toggle('open');};
(()=>{let y0=null;$('handle').addEventListener('pointerdown',e=>{y0=e.clientY;});$('handle').addEventListener('pointerup',e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;if(dy<-20)$('drawer').classList.add('open');else if(dy>20)$('drawer').classList.remove('open');});})();
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:TZ})+' '+t('c_kyiv');},1000);
let lastV=null, lastFull=0;
async function refreshAll(){await Promise.all([loadState(),loadMarkers(),loadFeed(false)]);lastFull=Date.now();lastUpd=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:TZ});}
// every 15 s: a ~60-byte version ping; full reload only when the server says something changed (or every 60 s for staleness)
// 15 s pulse normally; 5 s while a ballistic / cruise-missile threat is open (server decides: /api/version.missile)
let MISSILE=false,pulseTimer=null,pulseBusy=false;
async function pulse(){ if(document.hidden||pulseBusy) return; pulseBusy=true; try{const v=await(await fetch('/api/version')).json(); checkBuild(v); if(v.missile!==MISSILE){MISSILE=!!v.missile;document.body.classList.toggle('missile',MISSILE);schedulePulse();} if(v.v!==lastV||Date.now()-lastFull>60000){lastV=v.v;await refreshAll();} else {lastUpd=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:TZ});} }catch(e){} pulseBusy=false; }
let nextPulse=Date.now()+15000,lastUpd=null;
function schedulePulse(){ clearInterval(pulseTimer); const iv=MISSILE?5000:15000; nextPulse=Date.now()+iv; pulseTimer=setInterval(()=>{nextPulse=Date.now()+iv;pulse();},iv); }
setInterval(()=>{ if(pulseBusy){$('upd').textContent=t('u_updating');return;} const left=Math.max(0,Math.ceil((nextPulse-Date.now())/1000)); $('upd').innerHTML=`${lastUpd?t('u_upd')+' '+lastUpd+' · ':''}<span class="cd">${left}s</span>`; },1000);
schedulePulse();setInterval(()=>{if(!document.hidden)render();},30000);setInterval(()=>{if(!document.hidden)loadHist();},180000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refreshAll();}});
(async()=>{await loadMap();fillDiscOblasts();loadDistricts();drawHome();assignTownOblasts();setView(0,0,110);updateTiles();layoutTownLabels();applySelOblast();await refreshAll();
  try{ checkBuild(await(await fetch('/api/version')).json()); }catch(e){}$('imph').textContent=IMP_H?IMP_H+'h':'';loadImpacts();await loadHist();connect();scheduleTick();})();
