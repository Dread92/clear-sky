<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<meta name="robots" content="noindex, nofollow">
<title>Clear Sky — usage</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0b0d11;--ink:#e8e6df;--ink2:#a9a79f;--ink3:#6c6b66;--line:#242830;--panel:#12151b;
  --ua-yellow:#ffd500;--green:#2fbf71;--orange:#ff8a3d;--blue:#5b9cff;--red:#e0342c;
  --cond:"Barlow Condensed",system-ui,sans-serif;--sans:"Barlow",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding:16px;max-width:900px;margin:0 auto}
h1{font:800 26px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px}
.sub{color:var(--ink3);font:500 12px var(--mono);margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--ua-yellow);padding:12px 14px}
.card .v{font:800 30px/1 var(--cond)}
.card .l{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-top:4px}
.card.g{border-left-color:var(--green)}.card.b{border-left-color:var(--blue)}.card.o{border-left-color:var(--orange)}
h2{font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-bottom:4px}
.bars .b{flex:1;min-width:3px;background:var(--blue);border-radius:2px 2px 0 0;position:relative;opacity:.9}
.bars .b:hover{opacity:1;outline:1px solid var(--ink2)}
.days{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink3)}
table{width:100%;border-collapse:collapse;font:13px var(--sans)}
th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n{text-align:right;font-family:var(--mono)}
.foot{color:var(--ink3);font:12px/1.5 var(--sans);margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.note{color:var(--ink2);font:12px/1.55 var(--sans);border-left:2px solid var(--ua-yellow);padding-left:9px;margin:-8px 0 18px}
.err{background:#3a1512;border-left:3px solid var(--red);padding:12px;font:13px var(--sans)}
button.rv{border:1px solid var(--line);padding:9px 12px;font:600 12.5px var(--sans);cursor:pointer;border-radius:2px}
button.rv:disabled{opacity:.45;cursor:default}
#review .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);padding:12px 14px}
a{color:#8fb4ff}
.lang span{display:inline-block;margin-right:12px;font:600 12px var(--mono)}
/* EN / UA for the dashboard itself. The posts under review are Ukrainian; whoever is reviewing them may not
   be, and somebody reviewing in Ukrainian should not have to read an English interface to do it. */
.langsw{position:absolute;top:16px;right:16px;display:flex;gap:0;border:1px solid var(--line)}
.langsw button{background:transparent;border:0;color:var(--ink3);font:600 11.5px var(--mono);letter-spacing:.08em;padding:6px 11px;cursor:pointer}
.langsw button.on{background:var(--panel);color:var(--ua-yellow)}
.hdr{position:relative}
.posthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.posthead .tagl{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--ink3)}
.alt{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;color:var(--ink2);font:12.5px/1.5 var(--sans);white-space:pre-wrap}
</style>
</head>
<body>
<div class="hdr">
  <h1>Clear Sky — usage</h1>
  <div class="sub" id="gen">loading…</div>
  <div class="langsw" id="langsw"><button data-l="en">EN</button><button data-l="uk">UA</button></div>
</div>
<div id="out"></div>
<div class="foot" id="foot"></div>
<script>
const $=i=>document.getElementById(i);

// ---------------------------------------------------------------------------------------------------
// Two languages, one string table. Same discipline as the app: every label lives here, in both, so a
// missing one is visible instead of silently English.
// ---------------------------------------------------------------------------------------------------
const T={
 en:{title:'Clear Sky — usage',
  c_today:'devices today',c_7:'device-days · 7 d',c_30:'device-days · 30 d',c_push:'push subscribers',
  c_opens:'app opens · 30 d',c_pwa:'opened as an app',
  note:'A <b>device-day</b> is one device on one day. Somebody who opens the app every day for a week counts seven times, and that is on purpose: the daily hash is regenerated every midnight precisely so the same person cannot be recognised tomorrow. There is no unique-visitor figure here and there cannot be one — that is the cost of not tracking anybody, and it is worth it.',
  h_devices:'Devices per day',h_lang:'Language',h_review:'Review readings',h_flags:'Flagged readings',h_daily:'Daily detail',
  t_day:'Day',t_dev:'Devices',t_opens:'Opens',t_pings:'Pings',t_app:'As app',t_black:'Blackout',
  rv_loading:'Loading…',rv_none:'Nothing left to review.',rv_pull:'Run {0} to merge your answers into the repo.',
  rv_left:'{0} left',rv_makes:'WHAT THE APP MAKES OF IT',rv_nomarker:'no marker',rv_conf:'confidence',
  rv_tags:'tags',rv_ok:'✓ Correct — enforce it',rv_bad:'✗ Wrong — record it as a bug',rv_skip:'Skip',
  rv_hint:'The question is not whether the app did something reasonable — it is whether that is what the post actually says. When unsure, skip.',
  rv_wrong:'What is wrong with it?',rv_err:'could not load the corpus',
  p_orig:'ORIGINAL (UK)',p_en:'ENGLISH',p_open:'open the post ↗',p_nolink:'source post not kept',
  p_auto:'rough offline translation — the glossary, not a service',p_fetching:'translating…',
  p_retry:'translate again ↻',p_failed:'translation service unreachable — showing the glossary',
  fl_open:'{0} open. To turn them into regression cases:',fl_none:'Nothing flagged. The ⚑ button on any marker files one.',
  fl_err:'could not load flagged readings',
  r_place:'wrong place',r_type:'wrong threat type',r_nt:'not a threat — news / announcement',
  r_gone:'already gone / shot down',r_other:'something else',
  foot:'<b>What is counted, and what is not.</b><br>A device is counted once a day through a one-way hash of its address and browser, salted with a random value that is thrown away and regenerated every midnight — so the same person cannot be followed from one day to the next, and no hash can be turned back into an address. No IP is stored. No location, no path through the app, no per-person history, nothing that identifies anybody. Only the daily totals on this page are kept.<br><br>This page needs <code>ADMIN_KEY</code> and is not served at all unless it is set. <code>ADMIN_KEY</code> protects this dashboard only — the map stays public. (<code>ACCESS_KEY</code> is the other one: it puts a password box in front of the whole map, for a private deployment.)',
  gen:'generated {0}'},
 uk:{title:'Clear Sky — використання',
  c_today:'пристроїв сьогодні',c_7:'пристроє-днів · 7 д',c_30:'пристроє-днів · 30 д',c_push:'підписок на сповіщення',
  c_opens:'відкриттів · 30 д',c_pwa:'відкрито як застосунок',
  note:'<b>Пристрій-день</b> — це один пристрій за один день. Той, хто відкриває застосунок щодня протягом тижня, рахується сім разів, і це навмисно: денний хеш перегенеровується щопівночі саме для того, щоб завтра ту саму людину не можна було впізнати. Показника унікальних відвідувачів тут немає і бути не може — така ціна того, що ми ні за ким не стежимо, і вона того варта.',
  h_devices:'Пристроїв на день',h_lang:'Мова',h_review:'Перевірка зчитувань',h_flags:'Позначені зчитування',h_daily:'Деталі за днями',
  t_day:'День',t_dev:'Пристроїв',t_opens:'Відкриттів',t_pings:'Пінгів',t_app:'Як застосунок',t_black:'Блекаут',
  rv_loading:'Завантаження…',rv_none:'Немає чого перевіряти.',rv_pull:'Виконайте {0}, щоб злити відповіді в репозиторій.',
  rv_left:'залишилось: {0}',rv_makes:'ЯК ЦЕ ЗЧИТАВ ЗАСТОСУНОК',rv_nomarker:'позначки немає',rv_conf:'впевненість',
  rv_tags:'теги',rv_ok:'✓ Правильно — зафіксувати',rv_bad:'✗ Хибно — записати як помилку',rv_skip:'Пропустити',
  rv_hint:'Питання не в тому, чи застосунок зробив щось розумне — а в тому, чи саме це сказано в дописі. Якщо не впевнені, пропустіть.',
  rv_wrong:'Що саме тут не так?',rv_err:'не вдалося завантажити корпус',
  p_orig:'ОРИГІНАЛ (УКР)',p_en:'АНГЛІЙСЬКОЮ',p_open:'відкрити допис ↗',p_nolink:'вихідний допис не збережено',
  p_auto:'грубий офлайн-переклад — глосарій, не сервіс',p_fetching:'перекладаємо…',
  p_retry:'перекласти ще раз ↻',p_failed:'сервіс перекладу недоступний — показано глосарій',
  fl_open:'Відкритих: {0}. Щоб зробити з них регресійні випадки:',fl_none:'Нічого не позначено. Кнопка ⚑ на будь-якій позначці створює запис.',
  fl_err:'не вдалося завантажити позначені зчитування',
  r_place:'неправильне місце',r_type:'неправильний тип загрози',r_nt:'не загроза — новина / оголошення',
  r_gone:'вже збито / зникло',r_other:'щось інше',
  foot:'<b>Що рахується, а що ні.</b><br>Пристрій рахується раз на день через односторонній хеш адреси та браузера, посолений випадковим значенням, яке щопівночі відкидається й генерується заново — тож ту саму людину не можна відстежити з дня на день, і жоден хеш не можна перетворити назад на адресу. IP не зберігається. Ні місця, ні шляху застосунком, ні історії по людині, нічого, що когось ідентифікує. Зберігаються лише денні підсумки на цій сторінці.<br><br>Ця сторінка потребує <code>ADMIN_KEY</code> і взагалі не віддається, якщо його не задано. <code>ADMIN_KEY</code> захищає лише цю панель — карта лишається публічною. (<code>ACCESS_KEY</code> — це інше: він ставить форму пароля перед усією картою, для приватного розгортання.)',
  gen:'згенеровано {0}'}};

let L='en'; try{const v=localStorage.getItem('adminlang'); if(v==='en'||v==='uk') L=v;}catch(e){}
const tr=(k,...a)=>{let s=(T[L]&&T[L][k])!==undefined?T[L][k]:(T.en[k]!==undefined?T.en[k]:k);
  a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)}); return s;};
const fmt=n=>(n||0).toLocaleString(L==='uk'?'uk-UA':'en-GB');
const esc=t=>String(t==null?'':t).replace(/[<>&]/g,'');

let D=null, FLAGS=null, FLAGS_ERR=false;
const KEYQ=location.search.includes('key=')?'&'+location.search.slice(1):'';
let QUEUE=[], LEFT=0;

function drawAll(){
  document.documentElement.lang=L;
  document.title=tr('title');
  document.querySelector('h1').textContent=tr('title');
  $('foot').innerHTML=tr('foot');
  [...$('langsw').children].forEach(b=>b.classList.toggle('on',b.dataset.l===L));
  if(!D) return;
  const days=(D.days||[]).slice().reverse();
  const last7=days.slice(-7), last30=days;
  const sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0);
  const peak=Math.max(1,...days.map(x=>x.devices||0));
  const langs={}; days.forEach(x=>Object.entries(x.lang||{}).forEach(([k,v])=>langs[k]=(langs[k]||0)+v));
  const langTot=Object.values(langs).reduce((a,b)=>a+b,0)||1;
  $('gen').textContent=tr('gen',(D.generated||'').replace('T',' ').replace('Z',' UTC'));
  $('out').innerHTML=`
    <div class="cards">
      <div class="card"><div class="v">${fmt(D.today_devices)}</div><div class="l">${tr('c_today')}</div></div>
      <div class="card b"><div class="v">${fmt(sum(last7,'devices'))}</div><div class="l">${tr('c_7')}</div></div>
      <div class="card b"><div class="v">${fmt(sum(last30,'devices'))}</div><div class="l">${tr('c_30')}</div></div>
      <div class="card g"><div class="v">${fmt(D.push_subs)}</div><div class="l">${tr('c_push')}</div></div>
      <div class="card o"><div class="v">${fmt(sum(last30,'loads'))}</div><div class="l">${tr('c_opens')}</div></div>
      <div class="card o"><div class="v">${fmt(sum(last30,'pwa'))}</div><div class="l">${tr('c_pwa')}</div></div>
    </div>

    <div class="note">${tr('note')}</div>

    <h2>${tr('h_devices')}</h2>
    <div class="bars">${days.map(x=>`<div class="b" style="height:${Math.max(2,(x.devices||0)/peak*100)}%" title="${x.day}: ${x.devices} / ${x.loads}"></div>`).join('')}</div>
    <div class="days"><span>${days[0]?days[0].day:''}</span><span>${days.length?days[days.length-1].day:''}</span></div>

    <h2>${tr('h_lang')}</h2>
    <div class="lang">${[['uk','UA'],['en','EN'],['fr','FR']].map(([l,code])=>`<span>${code}: ${Math.round((langs[l]||0)/langTot*100)}% <span style="color:var(--ink3)">(${fmt(langs[l]||0)})</span></span>`).join('')}</div>

    <h2>${tr('h_review')}</h2>
    <div id="review">…</div>

    <h2>${tr('h_flags')}</h2>
    <div id="flags">…</div>

    <h2>${tr('h_daily')}</h2>
    <table><tr><th>${tr('t_day')}</th><th style="text-align:right">${tr('t_dev')}</th><th style="text-align:right">${tr('t_opens')}</th><th style="text-align:right">${tr('t_pings')}</th><th style="text-align:right">${tr('t_app')}</th><th style="text-align:right">${tr('t_black')}</th></tr>
      ${days.slice().reverse().map(x=>`<tr><td>${x.day}</td><td class="n">${fmt(x.devices)}</td><td class="n">${fmt(x.loads)}</td><td class="n">${fmt(x.pings)}</td><td class="n">${fmt(x.pwa)}</td><td class="n">${fmt(x.lite)}</td></tr>`).join('')}
    </table>`;
  drawReview();
  drawFlags();
}

// Reviewing the corpus from a browser instead of a terminal. One post, what this build makes of it, and
// three answers. Verdicts are stored on the server and merged back into the repo by `corpus.py pull` —
// the corpus file itself ships inside the image and cannot be written here.
function drawReview(){
  const box=$('review'); if(!box) return;
  if(!QUEUE.length){
    box.innerHTML=LEFT
      ? `<div style="color:var(--ink3);font:13px var(--sans)">${tr('rv_loading')}</div>`
      : `<div style="color:var(--green);font:13px var(--sans)">${tr('rv_none')} `
        + tr('rv_pull','<code style="color:#8fb4ff">python scripts/corpus.py pull</code>')+'</div>';
    return;
  }
  const c=QUEUE[0];
  const r=c.reading||{markers:[],tags:[]};
  const marks=r.markers.length
    ? r.markers.map(m=>`<div style="font:600 13px var(--mono);color:${m.status?'#ffb3ad':'#8fb4ff'}">
        ${esc(m.status||m.type)} · ${esc(m.place||'—')}${m.count?' ×'+m.count:''}${m.jet?' · jet':''}
        ${m.likely?' · likely '+esc(m.likely):''} <span style="color:var(--ink3)">· ${esc(m.conf)} ${tr('rv_conf')}</span></div>`).join('')
    : `<div style="font:600 13px var(--mono);color:var(--ink3)">${tr('rv_nomarker')}</div>`;
  // The reviewer's own language goes first; the other is always there underneath, because the judgement is
  // about what the Ukrainian says and a translation is a reading of it, not the evidence itself.
  const ua=esc(c.text).slice(0,900), en=c.text_en?esc(c.text_en).slice(0,900):'';
  // only the glossary output carries the caveat — labelling a real translation as rough would be a lie in
  // the one panel whose entire job is judging whether a reading matches the words
  const cav=c.en_src==='offline'?tr('p_auto'):c.en_src==='failed'?tr('p_failed'):(c.en_src===undefined?tr('p_fetching'):'');
  const first=L==='uk'?{lbl:tr('p_orig'),body:ua}:{lbl:tr('p_en'),body:en||ua};
  const second=L==='uk'?(en?{lbl:tr('p_en'),body:en}:null):{lbl:tr('p_orig'),body:ua};
  const link=c.post_id
    ? `<a href="https://t.me/${esc(c.post_id)}" target="_blank" rel="noopener">${tr('p_open')}</a>`
    : `<a href="https://t.me/s/${esc(c.channel)}" target="_blank" rel="noopener">@${esc(c.channel)} ↗</a>
       <span style="color:var(--ink3)"> · ${tr('p_nolink')}</span>`;
  box.innerHTML=`
    <div style="color:var(--ink3);font:12px var(--mono);margin-bottom:8px">${tr('rv_left',LEFT)} · @${esc(c.channel)} · ${esc((c.ts||'').slice(0,16).replace('T',' '))} · ${link}</div>
    <div class="card" style="border-left-color:var(--blue)">
      <div class="posthead"><span class="tagl">${first.lbl}</span><span class="tagl" style="color:var(--ink3);font-weight:400">${cav?esc(cav)+' · ':''}<a href="#" id="retr">${tr('p_retry')}</a></span></div>
      <div style="font:13px/1.5 var(--sans);white-space:pre-wrap">${first.body}</div>
      ${second?`<div class="alt"><span class="tagl">${second.lbl}</span><br>${second.body}</div>`:''}
    </div>
    <div class="card" style="border-left-color:var(--ua-yellow);margin-top:8px">
      <div style="font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--ink3);margin-bottom:6px">${tr('rv_makes')}</div>
      ${marks}
      <div style="font:11px var(--mono);color:var(--ink3);margin-top:6px">${tr('rv_tags')}: ${r.tags.join(', ')||'—'}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="rv" data-v="verified" style="background:#123020;border-color:var(--green);color:#c9f2da">${tr('rv_ok')}</button>
      <button class="rv" data-v="known_bad" style="background:#3a1512;border-color:var(--red);color:#ffd6d6">${tr('rv_bad')}</button>
      <button class="rv" data-v="skip" style="background:transparent;color:var(--ink3)">${tr('rv_skip')}</button>
    </div>
    <div style="color:var(--ink3);font:11.5px/1.5 var(--sans);margin-top:8px">${tr('rv_hint')}</div>`;
  // A real translation for the case on screen: automatically when all we have is the glossary, and on
  // demand otherwise — a stored translation can be a glossary fallback too, and a reviewer judging whether a
  // reading matches the words cannot do it against transliterated Ukrainian.
  function retranslate(force){
    c._asked=true;
    fetch('/api/corpus/translate'+(KEYQ?'?'+KEYQ.slice(1):''),{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,text:c.text,force:!!force})})
      .then(r=>r.json()).then(d=>{
        if(d&&d.text_en){ c.text_en=d.text_en; c.en_src=d.en_src==='online'?'online':'failed'; }
        else c.en_src='failed';
        if(QUEUE[0]&&QUEUE[0].id===c.id) drawReview();
      }).catch(()=>{ c.en_src='failed'; if(QUEUE[0]&&QUEUE[0].id===c.id) drawReview(); });
  }
  const rt=$('retr'); if(rt) rt.onclick=e=>{e.preventDefault(); c.en_src=undefined; drawReview(); retranslate(true);};
  if(c.en_src==='offline'&&!c._asked) retranslate(false);
  box.querySelectorAll('.rv').forEach(b=>b.onclick=async()=>{
    const v=b.dataset.v;
    box.querySelectorAll('.rv').forEach(x=>x.disabled=true);
    if(v!=='skip'){
      let note='';
      if(v==='known_bad'){ note=prompt(tr('rv_wrong'))||''; }
      try{
        await fetch('/api/corpus/review'+(KEYQ?'?'+KEYQ.slice(1):''),{method:'POST',
          headers:{'Content-Type':'application/json'},body:JSON.stringify({id:c.id,state:v,note})});
        LEFT=Math.max(0,LEFT-1);
      }catch(e){ /* keep it in the queue if it could not be saved */ }
    }
    QUEUE.shift();
    if(QUEUE.length<3&&LEFT>QUEUE.length) loadReview(true);
    drawReview();
  });
}
async function loadReview(more){
  try{
    const r=await fetch('/api/corpus?limit=25'+KEYQ);
    const d=await r.json();
    if(d.error){ if($('review')) $('review').innerHTML='<div class="err">'+esc(d.error)+'</div>'; return; }
    LEFT=d.pending||0;
    const have=new Set(QUEUE.map(c=>c.id));
    (d.cases||[]).forEach(c=>{ if(!have.has(c.id)) QUEUE.push(c); });
    if(!more) drawReview();
  }catch(e){ if($('review')) $('review').innerHTML=`<div class="err">${tr('rv_err')}</div>`; }
}

// Markers somebody using the map said were wrong. Nothing here identifies who: the post, the reading and
// what they said about it, and that is all that was ever stored.
function drawFlags(){
  const box=$('flags'); if(!box) return;
  if(FLAGS_ERR){ box.innerHTML=`<div class="err">${tr('fl_err')}</div>`; return; }
  if(FLAGS===null){ box.innerHTML=`<div style="color:var(--ink3);font:12px var(--sans)">${tr('rv_loading')}</div>`; return; }
  const R={place:tr('r_place'),type:tr('r_type'),not_a_threat:tr('r_nt'),already_gone:tr('r_gone'),other:tr('r_other')};
  box.innerHTML=FLAGS.length?`
    <div style="color:var(--ink3);font:12px var(--sans);margin-bottom:10px">
      ${tr('fl_open',FLAGS.length)}
      <code style="color:#8fb4ff">python scripts/corpus.py flags --import</code>
    </div>`+FLAGS.map(f=>`
    <div class="card" style="border-left-color:var(--orange);margin-bottom:8px">
      <div style="font:600 12px var(--mono);color:var(--orange)">${(R[f.reason]||esc(f.reason)).toUpperCase()}
        <span style="color:var(--ink3);font-weight:400"> · @${esc(f.channel||'?')} · ${esc((f.ts||'').replace('T',' ').replace('Z',''))} · ${esc(f.place||'')} ${esc(f.kind||'')}</span>
        ${f.post_id?` · <a href="https://t.me/${esc(f.post_id)}" target="_blank" rel="noopener">${tr('p_open')}</a>`:''}</div>
      ${f.note?`<div style="font:500 13px var(--sans);margin-top:6px">"${esc(f.note)}"</div>`:''}
      <div style="font:12px/1.45 var(--sans);color:var(--ink2);margin-top:6px;white-space:pre-wrap">${esc((f.text||'').slice(0,320))}</div>
    </div>`).join('')
    : `<div style="color:var(--ink3);font:12px var(--sans)">${tr('fl_none')}</div>`;
}

$('langsw').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  L=b.dataset.l; try{localStorage.setItem('adminlang',L);}catch(err){}
  drawAll();
});

(async()=>{
  drawAll();                                   // header + footer in the chosen language before anything loads
  try{ const r=await fetch('/api/usage?days=30'+(location.search.includes('key=')?'&'+location.search.slice(1):''));
       D=await r.json(); if(D.error) throw new Error(D.error); }
  catch(e){ $('out').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'; $('gen').textContent=''; D=null; return; }
  drawAll();
  loadReview();
  try{
    const fr=await fetch('/api/flags?limit=100'+(location.search.includes('key=')?'&'+location.search.slice(1):''));
    const fd=await fr.json();
    FLAGS=fd.flags||[];
  }catch(e){ FLAGS_ERR=true; }
  drawFlags();
})();
</script>
</body>
</html>
