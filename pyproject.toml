[project]
name = "clear-sky"
version = "1.0.0"
description = "Unofficial air-raid and drone tracker for Kyiv and all of Ukraine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
push = ["cryptography>=42.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 160
target-version = "py39"
exclude = ["static", ".venv"]

[tool.ruff.lint]
# The codebase favours dense, readable parsing code; these rules fight it.
select = ["E", "F", "W", "I"]
# E701/E702: the parsing code uses dense one-line guards on purpose; E402: sys.path set-up before imports
ignore = ["E501", "E741", "E402", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-q"
